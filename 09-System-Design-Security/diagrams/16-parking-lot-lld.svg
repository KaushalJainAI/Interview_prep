<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="660" viewBox="0 0 1180 660">
  <style>
    .title{font:700 26px Segoe UI,Arial;fill:#172033}.box{stroke:#334155;stroke-width:1.8;rx:8}.blue{fill:#e8f2ff}.green{fill:#e9f9ef}.yellow{fill:#fff7dc}.pink{fill:#fff0f5}.txt{font:600 15px Segoe UI,Arial;fill:#172033}.small{font:12px Segoe UI,Arial;fill:#334155}.arrow{stroke:#1f6feb;stroke-width:2;fill:none;marker-end:url(#m)}
  </style>
  <defs><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1f6feb"/></marker></defs>
  <text x="590" y="38" text-anchor="middle" class="title">Example LLD: Parking Lot Object Model</text>
  <rect x="60" y="95" width="180" height="95" class="box blue"/><text x="150" y="125" text-anchor="middle" class="txt">ParkingLot</text><text x="150" y="150" text-anchor="middle" class="small">floors, gates</text><text x="150" y="168" text-anchor="middle" class="small">park(), exit()</text>
  <rect x="330" y="95" width="180" height="95" class="box blue"/><text x="420" y="125" text-anchor="middle" class="txt">ParkingFloor</text><text x="420" y="150" text-anchor="middle" class="small">spots by type</text><text x="420" y="168" text-anchor="middle" class="small">availability()</text>
  <rect x="600" y="95" width="180" height="95" class="box green"/><text x="690" y="125" text-anchor="middle" class="txt">ParkingSpot</text><text x="690" y="150" text-anchor="middle" class="small">spot_type, vehicle</text><text x="690" y="168" text-anchor="middle" class="small">park(), unpark()</text>
  <rect x="870" y="95" width="180" height="95" class="box green"/><text x="960" y="125" text-anchor="middle" class="txt">Vehicle</text><text x="960" y="150" text-anchor="middle" class="small">license_no</text><text x="960" y="168" text-anchor="middle" class="small">vehicle_type</text>
  <path class="arrow" d="M240 142 H330"/><path class="arrow" d="M510 142 H600"/><path class="arrow" d="M780 142 H870"/>
  <rect x="115" y="300" width="190" height="90" class="box yellow"/><text x="210" y="330" text-anchor="middle" class="txt">Ticket</text><text x="210" y="354" text-anchor="middle" class="small">vehicle, spot</text><text x="210" y="372" text-anchor="middle" class="small">entry_time</text>
  <rect x="390" y="300" width="220" height="90" class="box pink"/><text x="500" y="330" text-anchor="middle" class="txt">PricingStrategy</text><text x="500" y="354" text-anchor="middle" class="small">hourly/weekend/flat</text><text x="500" y="372" text-anchor="middle" class="small">calculate(ticket)</text>
  <rect x="700" y="300" width="240" height="90" class="box pink"/><text x="820" y="330" text-anchor="middle" class="txt">SpotAssignmentStrategy</text><text x="820" y="354" text-anchor="middle" class="small">nearest/cheapest</text><text x="820" y="372" text-anchor="middle" class="small">find(vehicle)</text>
  <path class="arrow" d="M150 190 C150 245 210 250 210 300"/><path class="arrow" d="M690 190 C640 240 530 245 500 300"/><path class="arrow" d="M690 190 C760 240 815 245 820 300"/>
  <rect x="270" y="495" width="650" height="78" class="box blue"/><text x="595" y="524" text-anchor="middle" class="txt">Design Thinking</text><text x="595" y="548" text-anchor="middle" class="small">Entities own state; strategies own changing rules; ParkingLot orchestrates use cases without becoming a god class.</text>
</svg>

