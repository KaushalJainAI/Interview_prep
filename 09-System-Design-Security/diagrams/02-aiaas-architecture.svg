<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" font-family="Arial, sans-serif" font-size="13">
  <style>
    .box { fill:#fff; stroke:#222; stroke-width:2; }
    .lbl { fill:#222; text-anchor:middle; }
    .small { font-size:11px; fill:#444; text-anchor:middle; }
    .title { font-size:18px; font-weight:bold; text-anchor:middle; }
    .frontend { fill:#fff5e6; stroke:#d35400; }
    .compiler { fill:#cfe2ff; }
    .executor { fill:#d4edda; }
    .state { fill:#fff3cd; }
    .db { fill:#e2d9f3; }
    .ext { fill:#f8d7da; }
    .mcp { fill:#d1ecf1; }
    .arrow { stroke:#222; stroke-width:1.8; fill:none; marker-end:url(#a); }
    .ws { stroke:#198754; stroke-width:2.5; fill:none; marker-end:url(#g); stroke-dasharray:4,3; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10z" fill="#222"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10z" fill="#198754"/></marker>
  </defs>

  <text x="500" y="28" class="title">AIAAS — Agentic Workflow Platform Architecture (your flagship project)</text>

  <!-- Frontend -->
  <rect class="box frontend" x="40" y="60" width="220" height="100" rx="8"/>
  <text x="150" y="85" class="lbl" font-weight="bold">React + TypeScript UI</text>
  <text x="150" y="105" class="small">ReactFlow visual editor</text>
  <text x="150" y="123" class="small">node palette, edges, configs</text>
  <text x="150" y="141" class="small">live status from WebSocket</text>

  <!-- Save / publish workflow -->
  <line class="arrow" x1="260" y1="100" x2="330" y2="100"/>
  <text x="295" y="92" class="small">workflow JSON</text>

  <!-- Compiler -->
  <rect class="box compiler" x="330" y="60" width="290" height="190" rx="8"/>
  <text x="475" y="85" class="lbl" font-weight="bold">Compiler (Django REST)</text>
  <text x="475" y="103" class="small">no LLM calls — pure validation</text>
  <text x="345" y="125" class="small" text-anchor="start">• Parse ReactFlow JSON → AST</text>
  <text x="345" y="142" class="small" text-anchor="start">• Node indexing (id → handler)</text>
  <text x="345" y="159" class="small" text-anchor="start">• DAG check (topological sort)</text>
  <text x="345" y="176" class="small" text-anchor="start">• Reachability from START → END</text>
  <text x="345" y="193" class="small" text-anchor="start">• Type-check edge IO schemas</text>
  <text x="345" y="210" class="small" text-anchor="start">• Resolve {{ expressions }}</text>
  <text x="345" y="227" class="small" text-anchor="start">• Validate configs &amp; credentials</text>
  <text x="345" y="244" class="small" text-anchor="start">→ emits executable Plan</text>

  <!-- Save plan -->
  <line class="arrow" x1="620" y1="155" x2="700" y2="155"/>
  <rect class="box db" x="700" y="130" width="160" height="50" rx="6"/>
  <text x="780" y="155" class="lbl">Plan store</text>
  <text x="780" y="172" class="small">Postgres (versioned)</text>

  <!-- Run trigger -->
  <line class="arrow" x1="150" y1="160" x2="150" y2="250"/>
  <text x="200" y="200" class="small" text-anchor="start">run / resume</text>

  <!-- Executor -->
  <rect class="box executor" x="40" y="250" width="580" height="220" rx="8"/>
  <text x="330" y="275" class="lbl" font-weight="bold">Executor (async workers)</text>
  <text x="330" y="293" class="small">walks Plan node-by-node, mutates shared state</text>

  <!-- node handlers row -->
  <rect class="box" x="60" y="310" width="120" height="50" rx="6" fill="#fff"/>
  <text x="120" y="332" class="lbl small">llm_call</text>
  <text x="120" y="350" class="small">multi-provider</text>

  <rect class="box" x="195" y="310" width="120" height="50" rx="6" fill="#fff"/>
  <text x="255" y="332" class="lbl small">mcp_tool_call</text>
  <text x="255" y="350" class="small">discovered tools</text>

  <rect class="box" x="330" y="310" width="120" height="50" rx="6" fill="#fff"/>
  <text x="390" y="332" class="lbl small">approval_gate</text>
  <text x="390" y="350" class="small">HITL pause</text>

  <rect class="box" x="465" y="310" width="120" height="50" rx="6" fill="#fff"/>
  <text x="525" y="332" class="lbl small">code_exec</text>
  <text x="525" y="350" class="small">sandboxed</text>

  <!-- state row -->
  <rect class="box state" x="60" y="380" width="265" height="70" rx="6"/>
  <text x="192" y="402" class="lbl" font-weight="bold">Shared workflow state</text>
  <text x="192" y="420" class="small">cursor · messages · vars · partial outputs</text>
  <text x="192" y="438" class="small">persisted after every node</text>

  <rect class="box state" x="335" y="380" width="265" height="70" rx="6"/>
  <text x="468" y="402" class="lbl" font-weight="bold">Execution log + heartbeat</text>
  <text x="468" y="420" class="small">per-node trace, timing, errors</text>
  <text x="468" y="438" class="small">heartbeat every N seconds</text>

  <!-- WebSocket back to UI -->
  <line class="ws" x1="468" y1="380" x2="468" y2="180"/>
  <line class="ws" x1="468" y1="180" x2="260" y2="120"/>
  <text x="380" y="200" class="small" fill="#198754">WebSocket live updates → UI</text>

  <!-- Persistence row -->
  <line class="arrow" x1="192" y1="450" x2="192" y2="490"/>
  <rect class="box db" x="120" y="490" width="160" height="50" rx="6"/>
  <text x="200" y="515" class="lbl">Postgres</text>
  <text x="200" y="532" class="small">workflow runs, logs, state snapshots</text>

  <line class="arrow" x1="468" y1="450" x2="468" y2="490"/>
  <rect class="box db" x="395" y="490" width="160" height="50" rx="6"/>
  <text x="475" y="515" class="lbl">Redis</text>
  <text x="475" y="532" class="small">task queue, heartbeats, WS pub/sub</text>

  <!-- MCP servers -->
  <line class="arrow" x1="315" y1="335" x2="700" y2="335"/>
  <rect class="box mcp" x="700" y="270" width="270" height="180" rx="8"/>
  <text x="835" y="295" class="lbl" font-weight="bold">MCP Servers (multiple)</text>
  <text x="835" y="313" class="small">discovered at run time</text>
  <rect class="box" x="720" y="325" width="230" height="32" rx="4"/>
  <text x="835" y="345" class="lbl small">filesystem · github · gmail · slack</text>
  <rect class="box" x="720" y="365" width="230" height="32" rx="4"/>
  <text x="835" y="385" class="lbl small">custom internal MCPs</text>
  <rect class="box" x="720" y="405" width="230" height="32" rx="4"/>
  <text x="835" y="425" class="lbl small">database / analytics MCPs</text>

  <!-- LLM providers -->
  <line class="arrow" x1="120" y1="310" x2="120" y2="270"/>
  <rect class="box ext" x="40" y="490" width="160" height="50" rx="6"/>
  <text x="120" y="515" class="lbl small">Claude / GPT / Llama</text>
  <text x="120" y="532" class="small">multi-provider router</text>

  <!-- credentials -->
  <rect class="box ext" x="700" y="490" width="270" height="50" rx="6"/>
  <text x="835" y="515" class="lbl">Encrypted credential vault</text>
  <text x="835" y="532" class="small">user-scoped, decrypted only in executor RAM</text>

  <!-- talking points -->
  <rect class="box" x="40" y="560" width="930" height="90" rx="8" fill="#f8f9fa"/>
  <text x="500" y="582" class="lbl" font-weight="bold">Why the compiler/executor split matters (system-design talking point)</text>
  <text x="55" y="603" font-size="12" fill="#333">• <tspan font-weight="bold">Compiler is pure CPU, no LLM calls</tspan> → validation feedback is instant (sub-second) and free; errors caught before any token spend</text>
  <text x="55" y="621" font-size="12" fill="#333">• <tspan font-weight="bold">Executor is durable + restartable</tspan> → state persisted after every node, so server restart / crash resumes from last checkpoint</text>
  <text x="55" y="639" font-size="12" fill="#333">• <tspan font-weight="bold">Versioned plans</tspan> → editing a workflow doesn't break in-flight runs; each run pins to the plan version it started with</text>
</svg>
