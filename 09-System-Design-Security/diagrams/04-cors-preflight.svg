<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 600" font-family="Arial, sans-serif" font-size="13">
  <style>
    .box { fill:#fff; stroke:#222; stroke-width:2; }
    .lbl { fill:#222; text-anchor:middle; }
    .small { font-size:11px; fill:#444; text-anchor:middle; }
    .title { font-size:18px; font-weight:bold; text-anchor:middle; }
    .browser { fill:#fff5e6; stroke:#d35400; }
    .server { fill:#cfe2ff; }
    .ok { stroke:#198754; stroke-width:2; fill:none; marker-end:url(#g); }
    .fail { stroke:#d32f2f; stroke-width:2; fill:none; marker-end:url(#r); }
    .info { stroke:#1565c0; stroke-width:2; fill:none; marker-end:url(#b); }
    .header { font-family:Consolas,monospace; font-size:11px; fill:#444; }
  </style>
  <defs>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10z" fill="#198754"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10z" fill="#d32f2f"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10z" fill="#1565c0"/></marker>
  </defs>

  <text x="475" y="28" class="title">CORS Preflight — How Browsers Gate Cross-Origin Requests</text>
  <text x="475" y="48" class="small">JS on https://app.com tries to POST JSON to https://api.com → browser inserts a preflight check</text>

  <!-- Lane headers -->
  <rect class="box browser" x="40" y="70" width="220" height="40" rx="6"/>
  <text x="150" y="95" class="lbl">Browser (JS on app.com)</text>
  <rect class="box server" x="680" y="70" width="220" height="40" rx="6"/>
  <text x="790" y="95" class="lbl">api.com (CORS-aware server)</text>

  <line x1="150" y1="110" x2="150" y2="560" stroke="#888" stroke-dasharray="3,3"/>
  <line x1="790" y1="110" x2="790" y2="560" stroke="#888" stroke-dasharray="3,3"/>

  <!-- Step 1: Preflight OPTIONS -->
  <text x="470" y="138" class="lbl" font-weight="bold">Step 1 — Preflight (automatic, before the actual POST)</text>

  <line class="info" x1="150" y1="160" x2="790" y2="160"/>
  <text x="470" y="155" class="lbl small">OPTIONS /api/orders</text>
  <text x="470" y="178" class="header" text-anchor="middle">Origin: https://app.com</text>
  <text x="470" y="193" class="header" text-anchor="middle">Access-Control-Request-Method: POST</text>
  <text x="470" y="208" class="header" text-anchor="middle">Access-Control-Request-Headers: content-type, authorization</text>

  <line class="info" x1="790" y1="230" x2="150" y2="230"/>
  <text x="470" y="225" class="lbl small">204 No Content</text>
  <text x="470" y="248" class="header" text-anchor="middle">Access-Control-Allow-Origin: https://app.com</text>
  <text x="470" y="263" class="header" text-anchor="middle">Access-Control-Allow-Methods: POST, GET, PUT, DELETE</text>
  <text x="470" y="278" class="header" text-anchor="middle">Access-Control-Allow-Headers: content-type, authorization</text>
  <text x="470" y="293" class="header" text-anchor="middle">Access-Control-Max-Age: 86400  (cache preflight 24h)</text>

  <!-- Step 2: Actual request -->
  <text x="470" y="325" class="lbl" font-weight="bold">Step 2 — Actual request (only if preflight passed)</text>

  <line class="ok" x1="150" y1="345" x2="790" y2="345"/>
  <text x="470" y="340" class="lbl small">POST /api/orders</text>
  <text x="470" y="363" class="header" text-anchor="middle">Origin: https://app.com</text>
  <text x="470" y="378" class="header" text-anchor="middle">Content-Type: application/json</text>
  <text x="470" y="393" class="header" text-anchor="middle">Authorization: Bearer …</text>

  <line class="ok" x1="790" y1="415" x2="150" y2="415"/>
  <text x="470" y="410" class="lbl small">201 Created  + Access-Control-Allow-Origin header</text>

  <!-- When preflight is skipped -->
  <rect class="box" x="40" y="445" width="430" height="120" rx="8" fill="#f8f9fa"/>
  <text x="255" y="468" class="lbl" font-weight="bold">When preflight is SKIPPED ("simple" request)</text>
  <text x="55" y="490" font-size="12" fill="#333">• Method is GET, HEAD, or POST</text>
  <text x="55" y="507" font-size="12" fill="#333">• Content-Type is text/plain, multipart/form-data,</text>
  <text x="55" y="522" font-size="12" fill="#333">  or application/x-www-form-urlencoded</text>
  <text x="55" y="539" font-size="12" fill="#333">• Only "simple" headers (no Authorization, no custom)</text>
  <text x="55" y="556" font-size="12" fill="#333">→ Browser just sends with Origin header, server replies with ACAO</text>

  <!-- Common pitfalls -->
  <rect class="box" x="490" y="445" width="430" height="120" rx="8" fill="#fff5f5"/>
  <text x="705" y="468" class="lbl" font-weight="bold">Common pitfalls</text>
  <text x="505" y="490" font-size="12" fill="#333">• ACAO: * + Allow-Credentials: true → INVALID combo</text>
  <text x="505" y="507" font-size="12" fill="#333">• Forgot OPTIONS handler → 405 → CORS error in DevTools</text>
  <text x="505" y="524" font-size="12" fill="#333">• Wildcard subdomain → echo back the Origin (allowlist)</text>
  <text x="505" y="541" font-size="12" fill="#333">• Cookies need credentials: 'include' on fetch + ACAC: true</text>
  <text x="505" y="558" font-size="12" fill="#333">• CORS is BROWSER ONLY — curl / Postman / server ignore it</text>
</svg>
