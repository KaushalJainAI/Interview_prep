<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680">
  <style>
    .title{font:700 26px Segoe UI,Arial;fill:#172033}.box{stroke:#334155;stroke-width:1.8;rx:8}.blue{fill:#e8f2ff}.green{fill:#e9f9ef}.yellow{fill:#fff7dc}.pink{fill:#fff0f5}.gray{fill:#f6f8fa}.txt{font:600 16px Segoe UI,Arial;fill:#172033}.small{font:13px Segoe UI,Arial;fill:#334155}.arrow{stroke:#1f6feb;stroke-width:2.2;fill:none;marker-end:url(#m)}.dash{stroke-dasharray:6 5}
  </style>
  <defs><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1f6feb"/></marker></defs>
  <text x="600" y="38" text-anchor="middle" class="title">Reference HLD Architecture for Product Backends</text>
  <rect x="45" y="95" width="130" height="60" class="box blue"/><text x="110" y="130" text-anchor="middle" class="txt">Client</text>
  <rect x="225" y="95" width="130" height="60" class="box blue"/><text x="290" y="121" text-anchor="middle" class="txt">CDN / WAF</text><text x="290" y="142" text-anchor="middle" class="small">edge + protection</text>
  <rect x="405" y="95" width="150" height="60" class="box blue"/><text x="480" y="121" text-anchor="middle" class="txt">Load Balancer</text><text x="480" y="142" text-anchor="middle" class="small">health checks</text>
  <rect x="620" y="80" width="170" height="90" class="box green"/><text x="705" y="113" text-anchor="middle" class="txt">Stateless App</text><text x="705" y="136" text-anchor="middle" class="small">API, auth, validation</text><text x="705" y="154" text-anchor="middle" class="small">scale horizontally</text>
  <rect x="875" y="80" width="140" height="90" class="box yellow"/><text x="945" y="113" text-anchor="middle" class="txt">Redis Cache</text><text x="945" y="136" text-anchor="middle" class="small">hot reads</text><text x="945" y="154" text-anchor="middle" class="small">rate limit</text>
  <rect x="875" y="230" width="140" height="90" class="box yellow"/><text x="945" y="263" text-anchor="middle" class="txt">Primary DB</text><text x="945" y="286" text-anchor="middle" class="small">writes</text><text x="945" y="304" text-anchor="middle" class="small">transactions</text>
  <rect x="1040" y="230" width="120" height="90" class="box yellow"/><text x="1100" y="263" text-anchor="middle" class="txt">Replicas</text><text x="1100" y="286" text-anchor="middle" class="small">read scale</text>
  <rect x="625" y="260" width="160" height="75" class="box pink"/><text x="705" y="291" text-anchor="middle" class="txt">Queue</text><text x="705" y="313" text-anchor="middle" class="small">async work</text>
  <rect x="390" y="260" width="150" height="75" class="box pink"/><text x="465" y="291" text-anchor="middle" class="txt">Workers</text><text x="465" y="313" text-anchor="middle" class="small">emails, jobs, LLM</text>
  <rect x="180" y="250" width="140" height="75" class="box yellow"/><text x="250" y="281" text-anchor="middle" class="txt">Object Store</text><text x="250" y="303" text-anchor="middle" class="small">files, media</text>
  <rect x="180" y="390" width="140" height="75" class="box yellow"/><text x="250" y="421" text-anchor="middle" class="txt">Search / Vector</text><text x="250" y="443" text-anchor="middle" class="small">text, embeddings</text>
  <rect x="390" y="410" width="625" height="90" class="box gray"/><text x="703" y="442" text-anchor="middle" class="txt">Observability</text><text x="703" y="468" text-anchor="middle" class="small">structured logs + metrics + traces + alerts + audit events</text>
  <path class="arrow" d="M175 125 H225"/><path class="arrow" d="M355 125 H405"/><path class="arrow" d="M555 125 H620"/><path class="arrow" d="M790 125 H875"/>
  <path class="arrow" d="M705 170 V260"/><path class="arrow" d="M620 300 H540"/><path class="arrow" d="M390 300 H320"/>
  <path class="arrow" d="M790 145 C845 170 850 235 875 260"/><path class="arrow" d="M1015 275 H1040"/>
  <path class="arrow dash" d="M945 170 V230"/><path class="arrow dash" d="M465 335 V410"/><path class="arrow dash" d="M705 335 V410"/><path class="arrow dash" d="M945 320 V410"/><path class="arrow dash" d="M250 325 V390"/>
  <text x="600" y="600" text-anchor="middle" class="small">Reasoning: keep API stateless, cache hot reads, move slow work to queues, store blobs outside DB, observe every request path.</text>
</svg>

