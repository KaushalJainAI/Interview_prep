<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640">
  <style>
    .title{font:700 26px Segoe UI,Arial;fill:#172033}.box{stroke:#334155;stroke-width:1.8;rx:8}.ing{fill:#e8f2ff}.qry{fill:#e9f9ef}.store{fill:#fff7dc}.risk{fill:#fff0f5}.txt{font:600 15px Segoe UI,Arial;fill:#172033}.small{font:12.5px Segoe UI,Arial;fill:#334155}.arrow{stroke:#1f6feb;stroke-width:2.1;fill:none;marker-end:url(#m)}.red{stroke:#dc2626}
  </style>
  <defs><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1f6feb"/></marker></defs>
  <text x="600" y="36" text-anchor="middle" class="title">Example HLD: RAG Document QA System</text>
  <text x="235" y="78" text-anchor="middle" class="txt">Ingestion Path</text>
  <rect x="40" y="100" width="125" height="58" class="box ing"/><text x="102" y="133" text-anchor="middle" class="txt">Upload</text>
  <rect x="205" y="100" width="125" height="58" class="box ing"/><text x="267" y="126" text-anchor="middle" class="txt">Object</text><text x="267" y="144" text-anchor="middle" class="small">Store</text>
  <rect x="370" y="100" width="125" height="58" class="box ing"/><text x="432" y="126" text-anchor="middle" class="txt">Queue</text><text x="432" y="144" text-anchor="middle" class="small">async</text>
  <rect x="535" y="100" width="125" height="58" class="box ing"/><text x="597" y="126" text-anchor="middle" class="txt">Parse</text><text x="597" y="144" text-anchor="middle" class="small">PDF/OCR</text>
  <rect x="700" y="100" width="125" height="58" class="box ing"/><text x="762" y="126" text-anchor="middle" class="txt">Chunk</text><text x="762" y="144" text-anchor="middle" class="small">structure-aware</text>
  <rect x="865" y="100" width="125" height="58" class="box ing"/><text x="927" y="126" text-anchor="middle" class="txt">Embed</text><text x="927" y="144" text-anchor="middle" class="small">model pinned</text>
  <rect x="1030" y="100" width="125" height="58" class="box store"/><text x="1092" y="126" text-anchor="middle" class="txt">Vector DB</text><text x="1092" y="144" text-anchor="middle" class="small">tenant filter</text>
  <path class="arrow" d="M165 129 H205"/><path class="arrow" d="M330 129 H370"/><path class="arrow" d="M495 129 H535"/><path class="arrow" d="M660 129 H700"/><path class="arrow" d="M825 129 H865"/><path class="arrow" d="M990 129 H1030"/>
  <text x="245" y="258" text-anchor="middle" class="txt">Query Path</text>
  <rect x="40" y="285" width="130" height="60" class="box qry"/><text x="105" y="319" text-anchor="middle" class="txt">Question</text>
  <rect x="220" y="285" width="130" height="60" class="box qry"/><text x="285" y="310" text-anchor="middle" class="txt">Rewrite</text><text x="285" y="328" text-anchor="middle" class="small">optional</text>
  <rect x="400" y="285" width="130" height="60" class="box qry"/><text x="465" y="310" text-anchor="middle" class="txt">Retrieve</text><text x="465" y="328" text-anchor="middle" class="small">top-k</text>
  <rect x="580" y="285" width="130" height="60" class="box qry"/><text x="645" y="310" text-anchor="middle" class="txt">Rerank</text><text x="645" y="328" text-anchor="middle" class="small">precision</text>
  <rect x="760" y="285" width="130" height="60" class="box qry"/><text x="825" y="310" text-anchor="middle" class="txt">Prompt</text><text x="825" y="328" text-anchor="middle" class="small">citations</text>
  <rect x="940" y="285" width="130" height="60" class="box qry"/><text x="1005" y="310" text-anchor="middle" class="txt">LLM</text><text x="1005" y="328" text-anchor="middle" class="small">stream</text>
  <path class="arrow" d="M170 315 H220"/><path class="arrow" d="M350 315 H400"/><path class="arrow" d="M530 315 H580"/><path class="arrow" d="M710 315 H760"/><path class="arrow" d="M890 315 H940"/>
  <path class="arrow" d="M1092 158 C1092 230 470 220 465 285"/>
  <rect x="125" y="450" width="215" height="70" class="box risk"/><text x="232" y="477" text-anchor="middle" class="txt">Security</text><text x="232" y="499" text-anchor="middle" class="small">tenant isolation, prompt injection</text>
  <rect x="390" y="450" width="215" height="70" class="box risk"/><text x="497" y="477" text-anchor="middle" class="txt">Evaluation</text><text x="497" y="499" text-anchor="middle" class="small">faithfulness, recall@k, golden set</text>
  <rect x="655" y="450" width="215" height="70" class="box risk"/><text x="762" y="477" text-anchor="middle" class="txt">Operations</text><text x="762" y="499" text-anchor="middle" class="small">latency, cost, fallback, cache</text>
  <path class="arrow red" d="M232 450 C260 380 410 370 465 345"/><path class="arrow red" d="M497 450 C560 390 645 370 645 345"/><path class="arrow red" d="M762 450 C820 390 1005 370 1005 345"/>
  <text x="600" y="585" text-anchor="middle" class="small">Reasoning: async ingestion protects UX; reranking improves answer quality; citations + evals control hallucination; tenant filters prevent data leaks.</text>
