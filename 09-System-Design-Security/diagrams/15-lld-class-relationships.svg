<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="580" viewBox="0 0 1120 580">
  <style>
    .title{font:700 26px Segoe UI,Arial;fill:#172033}.box{fill:#f6f8fa;stroke:#334155;stroke-width:1.8;rx:8}.iface{fill:#e8f2ff;stroke:#1f6feb}.good{fill:#e9f9ef;stroke:#15803d}.txt{font:600 16px Segoe UI,Arial;fill:#172033}.small{font:13px Segoe UI,Arial;fill:#334155}.line{stroke:#334155;stroke-width:2;fill:none;marker-end:url(#m)}.tri{marker-end:url(#tri)}
  </style>
  <defs>
    <marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#334155"/></marker>
    <marker id="tri" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="white" stroke="#334155"/></marker>
  </defs>
  <text x="560" y="38" text-anchor="middle" class="title">LLD Class Relationships and Extension Points</text>
  <rect x="70" y="95" width="180" height="90" class="box"/><text x="160" y="125" text-anchor="middle" class="txt">ParkingLot</text><text x="160" y="150" text-anchor="middle" class="small">owns floors</text><text x="160" y="168" text-anchor="middle" class="small">coordinates use cases</text>
  <rect x="330" y="95" width="180" height="90" class="box"/><text x="420" y="125" text-anchor="middle" class="txt">ParkingFloor</text><text x="420" y="150" text-anchor="middle" class="small">owns spots</text>
  <rect x="590" y="95" width="180" height="90" class="box"/><text x="680" y="125" text-anchor="middle" class="txt">ParkingSpot</text><text x="680" y="150" text-anchor="middle" class="small">occupancy state</text>
  <rect x="850" y="95" width="180" height="90" class="box"/><text x="940" y="125" text-anchor="middle" class="txt">Vehicle</text><text x="940" y="150" text-anchor="middle" class="small">license, type</text>
  <path class="line" d="M250 140 H330"/><path class="line" d="M510 140 H590"/><path class="line" d="M770 140 H850"/>
  <rect x="180" y="300" width="220" height="95" class="iface"/><text x="290" y="330" text-anchor="middle" class="txt">PricingStrategy</text><text x="290" y="354" text-anchor="middle" class="small">price(ticket, exit_time)</text><text x="290" y="375" text-anchor="middle" class="small">interface</text>
  <rect x="500" y="285" width="210" height="70" class="good"/><text x="605" y="315" text-anchor="middle" class="txt">HourlyPricing</text><text x="605" y="337" text-anchor="middle" class="small">implementation</text>
  <rect x="500" y="380" width="210" height="70" class="good"/><text x="605" y="410" text-anchor="middle" class="txt">WeekendPricing</text><text x="605" y="432" text-anchor="middle" class="small">new extension</text>
  <path class="line tri" d="M500 320 H400"/><path class="line tri" d="M500 415 H400"/>
  <rect x="800" y="300" width="230" height="95" class="iface"/><text x="915" y="330" text-anchor="middle" class="txt">SpotAssignment</text><text x="915" y="354" text-anchor="middle" class="small">find_spot(vehicle)</text><text x="915" y="375" text-anchor="middle" class="small">strategy</text>
  <path class="line" d="M160 185 C160 255 240 260 290 300"/>
  <path class="line" d="M680 185 C735 250 840 250 915 300"/>
  <text x="560" y="525" text-anchor="middle" class="small">Reasoning: core entities own state; interfaces isolate rules that change, such as pricing and spot assignment.</text>
</svg>

