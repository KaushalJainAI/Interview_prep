<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 370" width="720" height="370">
<style>
  .title { font: bold 16px sans-serif; fill: #1a1a1a; }
  .label { font: 12px sans-serif; fill: #333; }
  .small { font: 10px sans-serif; fill: #555; }
  .mono  { font: 13px 'Consolas','Courier New',monospace; fill: #111; }
  .box   { fill: #f6f8fa; stroke: #444; stroke-width: 1.2; }
  .box2  { fill: #e6f0ff; stroke: #1f6feb; stroke-width: 1.5; }
  .box3  { fill: #fff3cd; stroke: #b58900; stroke-width: 1.5; }
  .box4  { fill: #d4edda; stroke: #1a7f37; stroke-width: 1.5; }
  .box5  { fill: #fce7f3; stroke: #be185d; stroke-width: 1.5; }
  .arrow { stroke: #444; stroke-width: 1.6; fill: none; marker-end: url(#arr); }
  .arrow2{ stroke: #1f6feb; stroke-width: 2; fill: none; marker-end: url(#arrB); }
  .arrow3{ stroke: #d33; stroke-width: 2; fill: none; marker-end: url(#arrR); }
</style>
<defs>
  <marker id="arr"  viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#444"/></marker>
  <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#1f6feb"/></marker>
  <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#d33"/></marker>
</defs>
<text x="360" y="22" text-anchor="middle" class="title">Drift Types -- Detection &amp; Action</text><rect x="40" y="60" width="160" height="40" class="box2"/><text x="120" y="85" text-anchor="middle" class="mono">Data drift</text><text x="210" y="85" class="small">input distribution moves</text><path class="arrow2" d="M 430 80 L 470 80"/><text x="475" y="85" class="mono">retrain / fine-tune</text><rect x="40" y="110" width="160" height="40" class="box3"/><text x="120" y="135" text-anchor="middle" class="mono">Label drift</text><text x="210" y="135" class="small">"correct" definition changes</text><path class="arrow2" d="M 430 130 L 470 130"/><text x="475" y="135" class="mono">update golden set</text><rect x="40" y="160" width="160" height="40" class="box4"/><text x="120" y="185" text-anchor="middle" class="mono">Concept drift</text><text x="210" y="185" class="small">underlying relationship moves</text><path class="arrow2" d="M 430 180 L 470 180"/><text x="475" y="185" class="mono">investigate, redesign</text><rect x="40" y="210" width="160" height="40" class="box5"/><text x="120" y="235" text-anchor="middle" class="mono">Model drift</text><text x="210" y="235" class="small">provider silently updates</text><path class="arrow2" d="M 430 230 L 470 230"/><text x="475" y="235" class="mono">pin model revision</text><rect x="40" y="260" width="160" height="40" class="box"/><text x="120" y="285" text-anchor="middle" class="mono">Prompt drift</text><text x="210" y="285" class="small">template edited without eval</text><path class="arrow2" d="M 430 280 L 470 280"/><text x="475" y="285" class="mono">redeploy old template</text><text x="40" y="345" class="small">Detect daily (high-volume) or weekly (low-volume). Always correlate drift to business metrics before reacting.</text></svg>