<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420">
<style>
  .title { font: bold 16px sans-serif; fill: #1a1a1a; }
  .label { font: 12px sans-serif; fill: #333; }
  .small { font: 10px sans-serif; fill: #555; }
  .mono  { font: 13px 'Consolas','Courier New',monospace; fill: #111; }
  .box   { fill: #f6f8fa; stroke: #444; stroke-width: 1.2; }
  .box2  { fill: #e6f0ff; stroke: #1f6feb; stroke-width: 1.5; }
  .box3  { fill: #fff3cd; stroke: #b58900; stroke-width: 1.5; }
  .box4  { fill: #d4edda; stroke: #1a7f37; stroke-width: 1.5; }
  .box5  { fill: #fce7f3; stroke: #be185d; stroke-width: 1.5; }
  .arrow { stroke: #444; stroke-width: 1.6; fill: none; marker-end: url(#arr); }
  .arrow2{ stroke: #1f6feb; stroke-width: 2; fill: none; marker-end: url(#arrB); }
  .arrow3{ stroke: #d33; stroke-width: 2; fill: none; marker-end: url(#arrR); }
</style>
<defs>
  <marker id="arr"  viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#444"/></marker>
  <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#1f6feb"/></marker>
  <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#d33"/></marker>
</defs>
<text x="360" y="22" text-anchor="middle" class="title">LLMOps -- Caching Layers &amp; Fallback Chain</text><rect x="60"  y="80" width="180" height="60" class="box2"/><text x="150" y="105" text-anchor="middle" class="mono">Exact-match cache</text><text x="150" y="125" text-anchor="middle" class="small">identical prompt+params</text><rect x="260" y="80" width="180" height="60" class="box3"/><text x="350" y="105" text-anchor="middle" class="mono">Semantic cache</text><text x="350" y="125" text-anchor="middle" class="small">cosine &gt; threshold</text><rect x="460" y="80" width="180" height="60" class="box4"/><text x="550" y="105" text-anchor="middle" class="mono">Prefix cache</text><text x="550" y="125" text-anchor="middle" class="small">shared system prompt</text><rect x="60"  y="170" width="180" height="60" class="box5"/><text x="150" y="195" text-anchor="middle" class="mono">KV cache</text><text x="150" y="215" text-anchor="middle" class="small">same conversation</text><rect x="260" y="170" width="180" height="60" class="box"/><text x="350" y="195" text-anchor="middle" class="mono">Tool-result cache</text><text x="350" y="215" text-anchor="middle" class="small">idempotent tools</text><text x="40" y="280" class="label">Fallback chain on failure:</text><rect x="80" y="310" width="180" height="44" class="box2"/><text x="170" y="337" text-anchor="middle" class="mono">primary model</text><path class="arrow3" d="M 260 332 L 310 332"/><rect x="310" y="310" width="180" height="44" class="box2"/><text x="400" y="337" text-anchor="middle" class="mono">cheap fallback</text><path class="arrow3" d="M 490 332 L 540 332"/><rect x="540" y="310" width="180" height="44" class="box2"/><text x="630" y="337" text-anchor="middle" class="mono">deterministic fallback</text><text x="40" y="395" class="small">Retry only on transient errors (429, 5xx). Idempotency keys on writes. Cost + latency logged per call.</text></svg>