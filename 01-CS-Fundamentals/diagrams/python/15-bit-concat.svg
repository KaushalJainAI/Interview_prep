<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 275" width="680" height="275">
<style>
  .title { font: bold 17px sans-serif; fill: #1a1a1a; }
  .label { font: 13px sans-serif; fill: #333; }
  .small { font: 11px sans-serif; fill: #555; }
  .tiny  { font: 10px sans-serif; fill: #777; }
  .mono  { font: 13px 'Consolas','Courier New',monospace; fill: #111; }
  .monos { font: 11px 'Consolas','Courier New',monospace; fill: #111; }
  .box   { fill: #f6f8fa; stroke: #444; stroke-width: 1.2; }
  .box2  { fill: #e6f0ff; stroke: #1f6feb; stroke-width: 1.5; }
  .box3  { fill: #fff3cd; stroke: #b58900; stroke-width: 1.5; }
  .box4  { fill: #d4edda; stroke: #1a7f37; stroke-width: 1.5; }
  .boxR  { fill: #fde2e1; stroke: #d33; stroke-width: 1.5; }
  .name  { fill: #fff; stroke: #444; stroke-width: 1.2; }
  .arrow { stroke: #444; stroke-width: 1.6; fill: none; marker-end: url(#arr); }
  .arrow2{ stroke: #1f6feb; stroke-width: 2; fill: none; marker-end: url(#arrB); }
  .arrow3{ stroke: #d33; stroke-width: 2; fill: none; marker-end: url(#arrR); }
  .arrG  { stroke: #1a7f37; stroke-width: 2; fill: none; marker-end: url(#arrG); }
  .dim   { stroke: #bbb; stroke-width: 1; fill: none; stroke-dasharray: 3 3; }
  .ok    { fill: #1a7f37; font: bold 13px sans-serif; }
  .bad   { fill: #d33; font: bold 13px sans-serif; }
</style>
<defs>
  <marker id="arr"  viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
    <path d="M0,0 L10,5 L0,10 Z" fill="#444"/></marker>
  <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
    <path d="M0,0 L10,5 L0,10 Z" fill="#1f6feb"/></marker>
  <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
    <path d="M0,0 L10,5 L0,10 Z" fill="#d33"/></marker>
  <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
    <path d="M0,0 L10,5 L0,10 Z" fill="#1a7f37"/></marker>
</defs>
<rect width="680" height="275" fill="#ffffff"/><text x="340" y="24" text-anchor="middle" class="title">Concatenating binary: shift to make room, then OR i</text><text x="30" y="50" text-anchor="start" class="monos">Append binary of i onto ans:  ans = (ans &lt;&lt; i.bit_length()) | i</text><text x="30" y="95" text-anchor="start" class="mono">ans = 0b101</text><rect x="150" y="78" width="30" height="30" rx="4" class="box2"/><text x="165.0" y="98.0" text-anchor="middle" class="mono">1</text><rect x="180" y="78" width="30" height="30" rx="4" class="box2"/><text x="195.0" y="98.0" text-anchor="middle" class="mono">0</text><rect x="210" y="78" width="30" height="30" rx="4" class="box2"/><text x="225.0" y="98.0" text-anchor="middle" class="mono">1</text><text x="280" y="95" text-anchor="start" class="mono">i = 3 = 0b11  (bit_length 2)</text><text x="30" y="150" text-anchor="start" class="small">&lt;&lt; 2 makes room:</text><rect x="150" y="133" width="30" height="30" rx="4" class="box2"/><text x="165.0" y="153.0" text-anchor="middle" class="mono">1</text><rect x="180" y="133" width="30" height="30" rx="4" class="box2"/><text x="195.0" y="153.0" text-anchor="middle" class="mono">0</text><rect x="210" y="133" width="30" height="30" rx="4" class="box2"/><text x="225.0" y="153.0" text-anchor="middle" class="mono">1</text><rect x="240" y="133" width="30" height="30" rx="4" class="box"/><text x="255.0" y="153.0" text-anchor="middle" class="mono">0</text><rect x="270" y="133" width="30" height="30" rx="4" class="box"/><text x="285.0" y="153.0" text-anchor="middle" class="mono">0</text><text x="30" y="205" text-anchor="start" class="small">| 3 fills it:</text><rect x="150" y="188" width="30" height="30" rx="4" class="box2"/><text x="165.0" y="208.0" text-anchor="middle" class="mono">1</text><rect x="180" y="188" width="30" height="30" rx="4" class="box2"/><text x="195.0" y="208.0" text-anchor="middle" class="mono">0</text><rect x="210" y="188" width="30" height="30" rx="4" class="box2"/><text x="225.0" y="208.0" text-anchor="middle" class="mono">1</text><rect x="240" y="188" width="30" height="30" rx="4" class="box4"/><text x="255.0" y="208.0" text-anchor="middle" class="mono">1</text><rect x="270" y="188" width="30" height="30" rx="4" class="box4"/><text x="285.0" y="208.0" text-anchor="middle" class="mono">1</text><text x="330" y="208" text-anchor="start" class="ok">= 0b10111  ✓</text><text x="30" y="255" text-anchor="start" class="small">WRONG: ans + ans &lt;&lt; k parses as (2*ans) &lt;&lt; k;  and ans+ans appends ans, not i.</text></svg>