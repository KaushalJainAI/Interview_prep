<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 385" width="620" height="385">
<style>
  .title { font: bold 16px sans-serif; fill: #1a1a1a; }
  .label { font: 12px sans-serif; fill: #333; }
  .small { font: 10px sans-serif; fill: #555; }
  .mono  { font: 13px 'Consolas','Courier New',monospace; fill: #111; }
  .box   { fill: #f6f8fa; stroke: #444; stroke-width: 1.2; }
  .box2  { fill: #e6f0ff; stroke: #1f6feb; stroke-width: 1.5; }
  .box3  { fill: #fff3cd; stroke: #b58900; stroke-width: 1.5; }
  .box4  { fill: #d4edda; stroke: #1a7f37; stroke-width: 1.5; }
  .arrow { stroke: #444; stroke-width: 1.6; fill: none; marker-end: url(#arr); }
  .arrow2{ stroke: #1f6feb; stroke-width: 2; fill: none; marker-end: url(#arrB); }
  .arrow3{ stroke: #d33; stroke-width: 2; fill: none; marker-end: url(#arrR); }
  .dim   { stroke: #bbb; stroke-width: 1; fill: none; stroke-dasharray: 3 3; }
</style>
<defs>
  <marker id="arr"  viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
    <path d="M0,0 L10,5 L0,10 Z" fill="#444"/></marker>
  <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
    <path d="M0,0 L10,5 L0,10 Z" fill="#1f6feb"/></marker>
  <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
    <path d="M0,0 L10,5 L0,10 Z" fill="#d33"/></marker>
</defs>
<text x="310" y="22" text-anchor="middle" class="title">Intervals — Sort &amp; Sweep</text><text x="40" y="60" class="label">Merge overlapping intervals (sort by start, sweep):</text><line x1="82" y1="90" x2="126" y2="90" stroke="#1f6feb" stroke-width="6"/><text x="134" y="94" class="small">[1,3]</text><line x1="104" y1="114" x2="192" y2="114" stroke="#1f6feb" stroke-width="6"/><text x="200" y="118" class="small">[2,6]</text><line x1="236" y1="138" x2="280" y2="138" stroke="#1f6feb" stroke-width="6"/><text x="288" y="142" class="small">[8,10]</text><line x1="390" y1="162" x2="456" y2="162" stroke="#1f6feb" stroke-width="6"/><text x="464" y="166" class="small">[15,18]</text><text x="40" y="210" class="label">After merge:</text><line x1="82" y1="230" x2="192" y2="230" stroke="#1a7f37" stroke-width="6"/><text x="200" y="234" class="small">[1,6]</text><line x1="236" y1="254" x2="280" y2="254" stroke="#1a7f37" stroke-width="6"/><text x="288" y="258" class="small">[8,10]</text><line x1="390" y1="278" x2="456" y2="278" stroke="#1a7f37" stroke-width="6"/><text x="464" y="282" class="small">[15,18]</text><line x1="60" y1="320" x2="540" y2="320" stroke="#555"/><line x1="60" y1="316" x2="60" y2="324" stroke="#555"/><text x="60" y="338" text-anchor="middle" class="small">0</text><line x1="104" y1="316" x2="104" y2="324" stroke="#555"/><text x="104" y="338" text-anchor="middle" class="small">2</text><line x1="148" y1="316" x2="148" y2="324" stroke="#555"/><text x="148" y="338" text-anchor="middle" class="small">4</text><line x1="192" y1="316" x2="192" y2="324" stroke="#555"/><text x="192" y="338" text-anchor="middle" class="small">6</text><line x1="236" y1="316" x2="236" y2="324" stroke="#555"/><text x="236" y="338" text-anchor="middle" class="small">8</text><line x1="280" y1="316" x2="280" y2="324" stroke="#555"/><text x="280" y="338" text-anchor="middle" class="small">10</text><line x1="324" y1="316" x2="324" y2="324" stroke="#555"/><text x="324" y="338" text-anchor="middle" class="small">12</text><line x1="368" y1="316" x2="368" y2="324" stroke="#555"/><text x="368" y="338" text-anchor="middle" class="small">14</text><line x1="412" y1="316" x2="412" y2="324" stroke="#555"/><text x="412" y="338" text-anchor="middle" class="small">16</text><line x1="456" y1="316" x2="456" y2="324" stroke="#555"/><text x="456" y="338" text-anchor="middle" class="small">18</text><line x1="500" y1="316" x2="500" y2="324" stroke="#555"/><text x="500" y="338" text-anchor="middle" class="small">20</text><text x="40" y="365" class="small">If start ≤ last.end → merge (extend end). Else push new. O(n log n) for sort.</text></svg>