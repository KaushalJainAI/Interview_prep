<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" width="720" height="330">
<style>
  .title { font: bold 16px sans-serif; fill: #1a1a1a; }
  .label { font: 12px sans-serif; fill: #333; }
  .small { font: 10px sans-serif; fill: #555; }
  .mono  { font: 13px 'Consolas','Courier New',monospace; fill: #111; }
  .box   { fill: #f6f8fa; stroke: #444; stroke-width: 1.2; }
  .box2  { fill: #e6f0ff; stroke: #1f6feb; stroke-width: 1.5; }
  .box3  { fill: #fff3cd; stroke: #b58900; stroke-width: 1.5; }
  .box4  { fill: #d4edda; stroke: #1a7f37; stroke-width: 1.5; }
  .arrow { stroke: #444; stroke-width: 1.6; fill: none; marker-end: url(#arr); }
  .arrow2{ stroke: #1f6feb; stroke-width: 2; fill: none; marker-end: url(#arrB); }
  .arrow3{ stroke: #d33; stroke-width: 2; fill: none; marker-end: url(#arrR); }
  .dim   { stroke: #bbb; stroke-width: 1; fill: none; stroke-dasharray: 3 3; }
</style>
<defs>
  <marker id="arr"  viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
    <path d="M0,0 L10,5 L0,10 Z" fill="#444"/></marker>
  <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
    <path d="M0,0 L10,5 L0,10 Z" fill="#1f6feb"/></marker>
  <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
    <path d="M0,0 L10,5 L0,10 Z" fill="#d33"/></marker>
</defs>
<text x="360" y="22" text-anchor="middle" class="title">Heap — Tree &amp; Array Representation</text><line x1="220" y1="92" x2="140" y2="118" stroke="#444"/><line x1="220" y1="92" x2="300" y2="118" stroke="#444"/><line x1="140" y1="162" x2="90" y2="188" stroke="#444"/><line x1="140" y1="162" x2="190" y2="188" stroke="#444"/><line x1="300" y1="162" x2="260" y2="188" stroke="#444"/><line x1="300" y1="162" x2="360" y2="188" stroke="#444"/><circle cx="220" cy="70" r="22" class="box2"/><text x="220" y="75" text-anchor="middle" class="mono">1</text><circle cx="140" cy="140" r="22" class="box2"/><text x="140" y="145" text-anchor="middle" class="mono">3</text><circle cx="300" cy="140" r="22" class="box2"/><text x="300" y="145" text-anchor="middle" class="mono">2</text><circle cx="90" cy="210" r="22" class="box2"/><text x="90" y="215" text-anchor="middle" class="mono">7</text><circle cx="190" cy="210" r="22" class="box2"/><text x="190" y="215" text-anchor="middle" class="mono">5</text><circle cx="260" cy="210" r="22" class="box2"/><text x="260" y="215" text-anchor="middle" class="mono">4</text><circle cx="360" cy="210" r="22" class="box2"/><text x="360" y="215" text-anchor="middle" class="mono">8</text><text x="450" y="80" class="label">Array form (1-indexed nav):</text><rect x="450" y="95" width="28" height="32" class="box"/><text x="464" y="117" text-anchor="middle" class="mono">1</text><text x="464" y="90" text-anchor="middle" class="small">0</text><rect x="480" y="95" width="28" height="32" class="box"/><text x="494" y="117" text-anchor="middle" class="mono">3</text><text x="494" y="90" text-anchor="middle" class="small">1</text><rect x="510" y="95" width="28" height="32" class="box"/><text x="524" y="117" text-anchor="middle" class="mono">2</text><text x="524" y="90" text-anchor="middle" class="small">2</text><rect x="540" y="95" width="28" height="32" class="box"/><text x="554" y="117" text-anchor="middle" class="mono">7</text><text x="554" y="90" text-anchor="middle" class="small">3</text><rect x="570" y="95" width="28" height="32" class="box"/><text x="584" y="117" text-anchor="middle" class="mono">5</text><text x="584" y="90" text-anchor="middle" class="small">4</text><rect x="600" y="95" width="28" height="32" class="box"/><text x="614" y="117" text-anchor="middle" class="mono">4</text><text x="614" y="90" text-anchor="middle" class="small">5</text><rect x="630" y="95" width="28" height="32" class="box"/><text x="644" y="117" text-anchor="middle" class="mono">8</text><text x="644" y="90" text-anchor="middle" class="small">6</text><text x="450" y="160" class="mono">parent(i) = (i-1)//2</text><text x="450" y="180" class="mono">left(i)   = 2i + 1</text><text x="450" y="200" class="mono">right(i)  = 2i + 2</text><text x="40" y="270" class="label">Min-heap invariant: parent ≤ both children.</text><text x="40" y="290" class="label">push: append + sift-up    pop: swap root with last + sift-down</text><text x="40" y="312" class="small">Both O(log n). Build heap from array: O(n) via heapify from bottom up.</text></svg>