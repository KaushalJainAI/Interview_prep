<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" width="640" height="380">
<style>
  .title { font: bold 16px sans-serif; fill: #1a1a1a; }
  .label { font: 12px sans-serif; fill: #333; }
  .small { font: 10px sans-serif; fill: #555; }
  .mono  { font: 13px 'Consolas','Courier New',monospace; fill: #111; }
  .box   { fill: #f6f8fa; stroke: #444; stroke-width: 1.2; }
  .box2  { fill: #e6f0ff; stroke: #1f6feb; stroke-width: 1.5; }
  .box3  { fill: #fff3cd; stroke: #b58900; stroke-width: 1.5; }
  .box4  { fill: #d4edda; stroke: #1a7f37; stroke-width: 1.5; }
  .arrow { stroke: #444; stroke-width: 1.6; fill: none; marker-end: url(#arr); }
  .arrow2{ stroke: #1f6feb; stroke-width: 2; fill: none; marker-end: url(#arrB); }
  .arrow3{ stroke: #d33; stroke-width: 2; fill: none; marker-end: url(#arrR); }
  .dim   { stroke: #bbb; stroke-width: 1; fill: none; stroke-dasharray: 3 3; }
</style>
<defs>
  <marker id="arr"  viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
    <path d="M0,0 L10,5 L0,10 Z" fill="#444"/></marker>
  <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
    <path d="M0,0 L10,5 L0,10 Z" fill="#1f6feb"/></marker>
  <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
    <path d="M0,0 L10,5 L0,10 Z" fill="#d33"/></marker>
</defs>
<text x="320" y="22" text-anchor="middle" class="title">Greedy — Activity Selection</text><text x="40" y="60" class="label">Activity selection: pick max non-overlapping intervals.</text><line x1="100" y1="90" x2="220" y2="90" stroke="#1a7f37" stroke-width="6" stroke-linecap="round"/><text x="228" y="94" class="small">[1,4]  ✓</text><line x1="180" y1="112" x2="260" y2="112" stroke="#bbb" stroke-width="6" stroke-linecap="round"/><text x="268" y="116" class="small">[3,5]</text><line x1="60" y1="134" x2="300" y2="134" stroke="#bbb" stroke-width="6" stroke-linecap="round"/><text x="308" y="138" class="small">[0,6]</text><line x1="260" y1="156" x2="340" y2="156" stroke="#1a7f37" stroke-width="6" stroke-linecap="round"/><text x="348" y="160" class="small">[5,7]  ✓</text><line x1="180" y1="178" x2="380" y2="178" stroke="#bbb" stroke-width="6" stroke-linecap="round"/><text x="388" y="182" class="small">[3,8]</text><line x1="260" y1="200" x2="420" y2="200" stroke="#bbb" stroke-width="6" stroke-linecap="round"/><text x="428" y="204" class="small">[5,9]</text><line x1="300" y1="222" x2="460" y2="222" stroke="#1a7f37" stroke-width="6" stroke-linecap="round"/><text x="468" y="226" class="small">[6,10]  ✓</text><line x1="380" y1="244" x2="500" y2="244" stroke="#bbb" stroke-width="6" stroke-linecap="round"/><text x="508" y="248" class="small">[8,11]</text><line x1="380" y1="266" x2="540" y2="266" stroke="#1a7f37" stroke-width="6" stroke-linecap="round"/><text x="548" y="270" class="small">[8,12]  ✓</text><line x1="60" y1="290" x2="540" y2="290" stroke="#555"/><line x1="60" y1="285" x2="60" y2="295" stroke="#555"/><text x="60" y="308" text-anchor="middle" class="small">0</text><line x1="100" y1="285" x2="100" y2="295" stroke="#555"/><text x="100" y="308" text-anchor="middle" class="small">1</text><line x1="140" y1="285" x2="140" y2="295" stroke="#555"/><text x="140" y="308" text-anchor="middle" class="small">2</text><line x1="180" y1="285" x2="180" y2="295" stroke="#555"/><text x="180" y="308" text-anchor="middle" class="small">3</text><line x1="220" y1="285" x2="220" y2="295" stroke="#555"/><text x="220" y="308" text-anchor="middle" class="small">4</text><line x1="260" y1="285" x2="260" y2="295" stroke="#555"/><text x="260" y="308" text-anchor="middle" class="small">5</text><line x1="300" y1="285" x2="300" y2="295" stroke="#555"/><text x="300" y="308" text-anchor="middle" class="small">6</text><line x1="340" y1="285" x2="340" y2="295" stroke="#555"/><text x="340" y="308" text-anchor="middle" class="small">7</text><line x1="380" y1="285" x2="380" y2="295" stroke="#555"/><text x="380" y="308" text-anchor="middle" class="small">8</text><line x1="420" y1="285" x2="420" y2="295" stroke="#555"/><text x="420" y="308" text-anchor="middle" class="small">9</text><line x1="460" y1="285" x2="460" y2="295" stroke="#555"/><text x="460" y="308" text-anchor="middle" class="small">10</text><line x1="500" y1="285" x2="500" y2="295" stroke="#555"/><text x="500" y="308" text-anchor="middle" class="small">11</text><line x1="540" y1="285" x2="540" y2="295" stroke="#555"/><text x="540" y="308" text-anchor="middle" class="small">12</text><text x="40" y="335" class="label">Greedy: sort by END time, pick if start ≥ last picked end.</text><text x="40" y="355" class="small">Exchange argument: any optimal solution can swap its first activity for ours without losing count.</text></svg>