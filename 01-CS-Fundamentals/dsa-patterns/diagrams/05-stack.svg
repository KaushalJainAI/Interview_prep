<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 360" width="620" height="360">
<style>
  .title { font: bold 16px sans-serif; fill: #1a1a1a; }
  .label { font: 12px sans-serif; fill: #333; }
  .small { font: 10px sans-serif; fill: #555; }
  .mono  { font: 13px 'Consolas','Courier New',monospace; fill: #111; }
  .box   { fill: #f6f8fa; stroke: #444; stroke-width: 1.2; }
  .box2  { fill: #e6f0ff; stroke: #1f6feb; stroke-width: 1.5; }
  .box3  { fill: #fff3cd; stroke: #b58900; stroke-width: 1.5; }
  .box4  { fill: #d4edda; stroke: #1a7f37; stroke-width: 1.5; }
  .arrow { stroke: #444; stroke-width: 1.6; fill: none; marker-end: url(#arr); }
  .arrow2{ stroke: #1f6feb; stroke-width: 2; fill: none; marker-end: url(#arrB); }
  .arrow3{ stroke: #d33; stroke-width: 2; fill: none; marker-end: url(#arrR); }
  .dim   { stroke: #bbb; stroke-width: 1; fill: none; stroke-dasharray: 3 3; }
</style>
<defs>
  <marker id="arr"  viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
    <path d="M0,0 L10,5 L0,10 Z" fill="#444"/></marker>
  <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
    <path d="M0,0 L10,5 L0,10 Z" fill="#1f6feb"/></marker>
  <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
    <path d="M0,0 L10,5 L0,10 Z" fill="#d33"/></marker>
</defs>
<text x="310" y="22" text-anchor="middle" class="title">Monotonic Stack — Next Greater Element</text><text x="40" y="60" class="label">Monotonic decreasing stack (Next Greater Element)</text><text x="40" y="85" class="mono">arr = [2, 1, 3]</text><text x="100" y="120" text-anchor="middle" class="small">step 1</text><text x="60" y="140" class="small">push 2</text><rect x="60" y="290" width="80" height="40" class="box2"/><text x="100" y="315" text-anchor="middle" class="mono">2</text><line x1="60" y1="291" x2="140" y2="291" stroke="#444" stroke-width="2"/><text x="270" y="120" text-anchor="middle" class="small">step 2</text><text x="230" y="140" class="small">push 1</text><rect x="230" y="290" width="80" height="40" class="box2"/><text x="270" y="315" text-anchor="middle" class="mono">1</text><rect x="230" y="246" width="80" height="40" class="box2"/><text x="270" y="271" text-anchor="middle" class="mono">2</text><line x1="230" y1="291" x2="310" y2="291" stroke="#444" stroke-width="2"/><text x="440" y="120" text-anchor="middle" class="small">step 3</text><text x="400" y="140" class="small">3 > 1: pop 1 (ans=3)</text><text x="400" y="155" class="small">3 > 2: pop 2 (ans=3)</text><text x="400" y="170" class="small">push 3</text><rect x="400" y="290" width="80" height="40" class="box2"/><text x="440" y="315" text-anchor="middle" class="mono">3</text><line x1="400" y1="291" x2="480" y2="291" stroke="#444" stroke-width="2"/><text x="40" y="335" class="small">Each element pushed/popped at most once → O(n) total.</text></svg>