<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 340" width="620" height="340">
<style>
  .title { font: bold 16px sans-serif; fill: #1a1a1a; }
  .label { font: 12px sans-serif; fill: #333; }
  .small { font: 10px sans-serif; fill: #555; }
  .mono  { font: 13px 'Consolas','Courier New',monospace; fill: #111; }
  .box   { fill: #f6f8fa; stroke: #444; stroke-width: 1.2; }
  .box2  { fill: #e6f0ff; stroke: #1f6feb; stroke-width: 1.5; }
  .box3  { fill: #fff3cd; stroke: #b58900; stroke-width: 1.5; }
  .box4  { fill: #d4edda; stroke: #1a7f37; stroke-width: 1.5; }
  .arrow { stroke: #444; stroke-width: 1.6; fill: none; marker-end: url(#arr); }
  .arrow2{ stroke: #1f6feb; stroke-width: 2; fill: none; marker-end: url(#arrB); }
  .arrow3{ stroke: #d33; stroke-width: 2; fill: none; marker-end: url(#arrR); }
  .dim   { stroke: #bbb; stroke-width: 1; fill: none; stroke-dasharray: 3 3; }
</style>
<defs>
  <marker id="arr"  viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
    <path d="M0,0 L10,5 L0,10 Z" fill="#444"/></marker>
  <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
    <path d="M0,0 L10,5 L0,10 Z" fill="#1f6feb"/></marker>
  <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
    <path d="M0,0 L10,5 L0,10 Z" fill="#d33"/></marker>
</defs>
<text x="310" y="22" text-anchor="middle" class="title">Linked List — Reversal Pattern</text><text x="40" y="60" class="label">Reverse a singly linked list (3 pointers)</text><rect x="60" y="100" width="60" height="40" class="box2"/><text x="90" y="125" text-anchor="middle" class="mono">1</text><path class="arrow" d="M 122 120 L 157 120"/><rect x="160" y="100" width="60" height="40" class="box2"/><text x="190" y="125" text-anchor="middle" class="mono">2</text><path class="arrow" d="M 222 120 L 257 120"/><rect x="260" y="100" width="60" height="40" class="box2"/><text x="290" y="125" text-anchor="middle" class="mono">3</text><path class="arrow" d="M 322 120 L 357 120"/><rect x="360" y="100" width="60" height="40" class="box2"/><text x="390" y="125" text-anchor="middle" class="mono">4</text><path class="arrow" d="M 422 120 L 457 120"/><rect x="460" y="100" width="60" height="40" class="box2"/><text x="490" y="125" text-anchor="middle" class="mono">∅</text><text x="90" y="180" text-anchor="middle" class="mono">prev=∅</text><text x="190" y="180" text-anchor="middle" class="mono">curr</text><text x="290" y="180" text-anchor="middle" class="mono">next</text><text x="40" y="225" class="label">Loop:</text><text x="60" y="247" class="mono">nxt = curr.next</text><text x="60" y="267" class="mono">curr.next = prev      # flip pointer</text><text x="60" y="287" class="mono">prev = curr; curr = nxt</text><text x="40" y="320" class="small">Return prev at end. O(n) time, O(1) space.</text></svg>