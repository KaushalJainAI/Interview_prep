</defs>
<text x="340" y="22" text-anchor="middle" class="title">Math &amp; Geometry — Rotate Matrix 90°</text><text x="40" y="60" class="label">Rotate matrix 90° clockwise:  transpose then reverse rows</text><text x="130" y="95" text-anchor="middle" class="label">original</text><rect x="60" y="110" width="44" height="44" class="box"/><text x="82" y="138" text-anchor="middle" class="mono">1</text><rect x="104" y="110" width="44" height="44" class="box"/><text x="126" y="138" text-anchor="middle" class="mono">2</text><rect x="148" y="110" width="44" height="44" class="box"/><text x="170" y="138" text-anchor="middle" class="mono">3</text><rect x="60" y="154" width="44" height="44" class="box"/><text x="82" y="182" text-anchor="middle" class="mono">4</text><rect x="104" y="154" width="44" height="44" class="box"/><text x="126" y="182" text-anchor="middle" class="mono">5</text><rect x="148" y="154" width="44" height="44" class="box"/><text x="170" y="182" text-anchor="middle" class="mono">6</text><rect x="60" y="198" width="44" height="44" class="box"/><text x="82" y="226" text-anchor="middle" class="mono">7</text><rect x="104" y="198" width="44" height="44" class="box"/><text x="126" y="226" text-anchor="middle" class="mono">8</text><rect x="148" y="198" width="44" height="44" class="box"/><text x="170" y="226" text-anchor="middle" class="mono">9</text><path class="arrow2" d="M 200 170 L 230 170"/><text x="330" y="95" text-anchor="middle" class="label">transpose</text><rect x="260" y="110" width="44" height="44" class="box"/><text x="282" y="138" text-anchor="middle" class="mono">1</text><rect x="304" y="110" width="44" height="44" class="box"/><text x="326" y="138" text-anchor="middle" class="mono">4</text><rect x="348" y="110" width="44" height="44" class="box"/><text x="370" y="138" text-anchor="middle" class="mono">7</text><rect x="260" y="154" width="44" height="44" class="box"/><text x="282" y="182" text-anchor="middle" class="mono">2</text><rect x="304" y="154" width="44" height="44" class="box"/><text x="326" y="182" text-anchor="middle" class="mono">5</text><rect x="348" y="154" width="44" height="44" class="box"/><text x="370" y="182" text-anchor="middle" class="mono">8</text><rect x="260" y="198" width="44" height="44" class="box"/><text x="282" y="226" text-anchor="middle" class="mono">3</text><rect x="304" y="198" width="44" height="44" class="box"/><text x="326" y="226" text-anchor="middle" class="mono">6</text><rect x="348" y="198" width="44" height="44" class="box"/><text x="370" y="226" text-anchor="middle" class="mono">9</text><path class="arrow2" d="M 400 170 L 430 170"/><text x="530" y="95" text-anchor="middle" class="label">reverse rows</text><rect x="460" y="110" width="44" height="44" class="box"/><text x="482" y="138" text-anchor="middle" class="mono">7</text><rect x="504" y="110" width="44" height="44" class="box"/><text x="526" y="138" text-anchor="middle" class="mono">4</text><rect x="548" y="110" width="44" height="44" class="box"/><text x="570" y="138" text-anchor="middle" class="mono">1</text><rect x="460" y="154" width="44" height="44" class="box"/><text x="482" y="182" text-anchor="middle" class="mono">8</text><rect x="504" y="154" width="44" height="44" class="box"/><text x="526" y="182" text-anchor="middle" class="mono">5</text><rect x="548" y="154" width="44" height="44" class="box"/><text x="570" y="182" text-anchor="middle" class="mono">2</text><rect x="460" y="198" width="44" height="44" class="box"/><text x="482" y="226" text-anchor="middle" class="mono">9</text><rect x="504" y="198" width="44" height="44" class="box"/><text x="526" y="226" text-anchor="middle" class="mono">6</text><rect x="548" y="198" width="44" height="44" class="box"/><text x="570" y="226" text-anchor="middle" class="mono">3</text><text x="40" y="310" class="label">Transpose:   M[i][j] ↔ M[j][i]   (swap across diagonal)</text><text x="40" y="332" class="label">Reverse rows: row[k] = reversed(row[k])</text><text x="40" y="360" cla