iddle" class="mono">[1,2]</text><rect x="188" y="286" width="64" height="28" class="box4"/><text x="220" y="305" text-anchor="middle" class="mono">[1,3]</text><rect x="258" y="286" width="64" height="28" class="box4"/><text x="290" y="305" text-anchor="middle" class="mono">[1]</text><rect x="308" y="286" width="64" height="28" class="box4"/><text x="340" y="305" text-anchor="middle" class="mono">[2,3]</text><rect x="378" y="286" width="64" height="28" class="box4"/><text x="410" y="305" text-anchor="middle" class="mono">[2]</text><rect x="458" y="286" width="64" height="28" class="box4"/><text x="490" y="305" text-anchor="middle" class="mono">[3]</text><rect x="528" y="286" width="64" height="28" class="box4"/><text x="560" y="305" text-anchor="middle" class="mono">[]</text><text x="40" y="340" class="label">Decision tree: at each step, "include" (left) or "skip" (right).</text><text x="40" y="360" class="small">Pruning = cut subtrees that can't lead to a valid answer (e.g. sum &gt; target).</text></svg>