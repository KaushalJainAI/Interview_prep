<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" width="720" height="380">
<style>
  .title { font: bold 16px sans-serif; fill: #1a1a1a; }
  .label { font: 12px sans-serif; fill: #333; }
  .small { font: 10px sans-serif; fill: #555; }
  .mono  { font: 13px 'Consolas','Courier New',monospace; fill: #111; }
  .box   { fill: #f6f8fa; stroke: #444; stroke-width: 1.2; }
  .box2  { fill: #e6f0ff; stroke: #1f6feb; stroke-width: 1.5; }
  .box3  { fill: #fff3cd; stroke: #b58900; stroke-width: 1.5; }
  .box4  { fill: #d4edda; stroke: #1a7f37; stroke-width: 1.5; }
  .box5  { fill: #fce7f3; stroke: #be185d; stroke-width: 1.5; }
  .arrow { stroke: #444; stroke-width: 1.6; fill: none; marker-end: url(#arr); }
  .arrow2{ stroke: #1f6feb; stroke-width: 2; fill: none; marker-end: url(#arrB); }
  .arrow3{ stroke: #d33; stroke-width: 2; fill: none; marker-end: url(#arrR); }
</style>
<defs>
  <marker id="arr"  viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#444"/></marker>
  <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#1f6feb"/></marker>
  <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#d33"/></marker>
</defs>
<text x="360" y="22" text-anchor="middle" class="title">Agent Orchestration — State Graph</text><text x="40" y="55" class="label">LangGraph-style state machine (deterministic + LLM-decided edges)</text><ellipse cx="120" cy="130" rx="55" ry="26" class="box2"/><text x="120" y="135" text-anchor="middle" class="mono">start</text><ellipse cx="280" cy="130" rx="55" ry="26" class="box2"/><text x="280" y="135" text-anchor="middle" class="mono">plan</text><ellipse cx="440" cy="90" rx="55" ry="26" class="box2"/><text x="440" y="95" text-anchor="middle" class="mono">search</text><ellipse cx="440" cy="170" rx="55" ry="26" class="box2"/><text x="440" y="175" text-anchor="middle" class="mono">code</text><ellipse cx="600" cy="130" rx="55" ry="26" class="box2"/><text x="600" y="135" text-anchor="middle" class="mono">verify</text><ellipse cx="600" cy="260" rx="55" ry="26" class="box2"/><text x="600" y="265" text-anchor="middle" class="mono">end</text><path class="arrow" d="M 175 130 Q 200.0 118 225 130"/><path class="arrow" d="M 335 130 Q 360.0 78 385 90"/><path class="arrow" d="M 335 130 Q 360.0 118 385 170"/><path class="arrow" d="M 495 90 Q 520.0 78 545 130"/><path class="arrow" d="M 495 170 Q 520.0 118 545 130"/><path class="arrow" d="M 655 130 Q 600.0 118 545 260"/><path class="arrow" d="M 655 130 Q 440.0 118 225 130"/><text x="40" y="330" class="mono">Each node = function over state dict. Edges can be conditional (router LLM).</text><text x="40" y="352" class="small">Benefits over open agent loops: visible flow, easier debugging, persistent state, branching.</text></svg>