<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" width="720" height="430">
<style>
  .title { font: bold 16px sans-serif; fill: #1a1a1a; }
  .label { font: 12px sans-serif; fill: #333; }
  .small { font: 10px sans-serif; fill: #555; }
  .mono  { font: 13px 'Consolas','Courier New',monospace; fill: #111; }
  .box   { fill: #f6f8fa; stroke: #444; stroke-width: 1.2; }
  .box2  { fill: #e6f0ff; stroke: #1f6feb; stroke-width: 1.5; }
  .box3  { fill: #fff3cd; stroke: #b58900; stroke-width: 1.5; }
  .box4  { fill: #d4edda; stroke: #1a7f37; stroke-width: 1.5; }
  .box5  { fill: #fce7f3; stroke: #be185d; stroke-width: 1.5; }
  .arrow { stroke: #444; stroke-width: 1.6; fill: none; marker-end: url(#arr); }
  .arrow2{ stroke: #1f6feb; stroke-width: 2; fill: none; marker-end: url(#arrB); }
  .arrow3{ stroke: #d33; stroke-width: 2; fill: none; marker-end: url(#arrR); }
</style>
<defs>
  <marker id="arr"  viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#444"/></marker>
  <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#1f6feb"/></marker>
  <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#d33"/></marker>
</defs>
<text x="360" y="22" text-anchor="middle" class="title">Agent Memory — Layered Architecture</text><rect x="60" y="60" width="240" height="40" class="box2"/><text x="180" y="85" text-anchor="middle" class="mono">Short-term (chat history)</text><text x="320" y="85" class="small">in context window; truncated/compressed</text><rect x="60" y="120" width="240" height="40" class="box3"/><text x="180" y="145" text-anchor="middle" class="mono">Working memory (scratchpad)</text><text x="320" y="145" class="small">free-form notes the agent writes</text><rect x="60" y="180" width="240" height="40" class="box4"/><text x="180" y="205" text-anchor="middle" class="mono">Long-term (vector DB)</text><text x="320" y="205" class="small">embedded facts, retrieved on demand</text><rect x="60" y="240" width="240" height="40" class="box5"/><text x="180" y="265" text-anchor="middle" class="mono">Episodic (past trajectories)</text><text x="320" y="265" class="small">previous task runs, for self-reflection</text><rect x="60" y="300" width="240" height="40" class="box"/><text x="180" y="325" text-anchor="middle" class="mono">Procedural (skills / tools)</text><text x="320" y="325" class="small">available actions, docs, examples</text><text x="40" y="380" class="mono">Context assembly each turn: pick from each layer, fit token budget.</text><text x="40" y="402" class="small">Compression strategies: summarisation, lossless eviction, embeddings recall.</text></svg>