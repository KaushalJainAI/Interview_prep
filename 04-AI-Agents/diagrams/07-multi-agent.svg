<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" width="720" height="430">
<style>
  .title { font: bold 16px sans-serif; fill: #1a1a1a; }
  .label { font: 12px sans-serif; fill: #333; }
  .small { font: 10px sans-serif; fill: #555; }
  .mono  { font: 13px 'Consolas','Courier New',monospace; fill: #111; }
  .box   { fill: #f6f8fa; stroke: #444; stroke-width: 1.2; }
  .box2  { fill: #e6f0ff; stroke: #1f6feb; stroke-width: 1.5; }
  .box3  { fill: #fff3cd; stroke: #b58900; stroke-width: 1.5; }
  .box4  { fill: #d4edda; stroke: #1a7f37; stroke-width: 1.5; }
  .box5  { fill: #fce7f3; stroke: #be185d; stroke-width: 1.5; }
  .arrow { stroke: #444; stroke-width: 1.6; fill: none; marker-end: url(#arr); }
  .arrow2{ stroke: #1f6feb; stroke-width: 2; fill: none; marker-end: url(#arrB); }
  .arrow3{ stroke: #d33; stroke-width: 2; fill: none; marker-end: url(#arrR); }
</style>
<defs>
  <marker id="arr"  viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#444"/></marker>
  <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#1f6feb"/></marker>
  <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#d33"/></marker>
</defs>
<text x="360" y="22" text-anchor="middle" class="title">Multi-Agent System — Hierarchical</text><rect x="295" y="58" width="130" height="44" class="box2"/><text x="360" y="85" text-anchor="middle" class="mono">Orchestrator</text><rect x="95" y="178" width="130" height="44" class="box4"/><text x="160" y="205" text-anchor="middle" class="mono">Researcher</text><rect x="295" y="178" width="130" height="44" class="box4"/><text x="360" y="205" text-anchor="middle" class="mono">Coder</text><rect x="495" y="178" width="130" height="44" class="box4"/><text x="560" y="205" text-anchor="middle" class="mono">Reviewer</text><rect x="295" y="298" width="130" height="44" class="box3"/><text x="360" y="325" text-anchor="middle" class="mono">Tools</text><line x1="360" y1="102" x2="160" y2="178" stroke="#1f6feb" stroke-width="1.5"/><line x1="360" y1="102" x2="360" y2="178" stroke="#1f6feb" stroke-width="1.5"/><line x1="360" y1="102" x2="560" y2="178" stroke="#1f6feb" stroke-width="1.5"/><line x1="160" y1="222" x2="360" y2="298" stroke="#1f6feb" stroke-width="1.5"/><line x1="360" y1="222" x2="360" y2="298" stroke="#1f6feb" stroke-width="1.5"/><line x1="560" y1="222" x2="360" y2="178" stroke="#1f6feb" stroke-width="1.5"/><text x="40" y="380" class="mono">Patterns: hierarchical (above), debate, swarm, blackboard.</text><text x="40" y="402" class="small">Comm via shared memory or message bus. Risks: infinite chatter, cost blow-up, role drift.</text></svg>