<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 500" width="720" height="500">
<style>
  .title { font: bold 16px sans-serif; fill: #1a1a1a; }
  .label { font: 12px sans-serif; fill: #333; }
  .small { font: 10px sans-serif; fill: #555; }
  .mono  { font: 13px 'Consolas','Courier New',monospace; fill: #111; }
  .box   { fill: #f6f8fa; stroke: #444; stroke-width: 1.2; }
  .box2  { fill: #e6f0ff; stroke: #1f6feb; stroke-width: 1.5; }
  .box3  { fill: #fff3cd; stroke: #b58900; stroke-width: 1.5; }
  .box4  { fill: #d4edda; stroke: #1a7f37; stroke-width: 1.5; }
  .box5  { fill: #fce7f3; stroke: #be185d; stroke-width: 1.5; }
  .arrow { stroke: #444; stroke-width: 1.6; fill: none; marker-end: url(#arr); }
  .arrow2{ stroke: #1f6feb; stroke-width: 2; fill: none; marker-end: url(#arrB); }
  .arrow3{ stroke: #d33; stroke-width: 2; fill: none; marker-end: url(#arrR); }
</style>
<defs>
  <marker id="arr"  viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#444"/></marker>
  <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#1f6feb"/></marker>
  <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#d33"/></marker>
</defs>
<text x="360" y="22" text-anchor="middle" class="title">Agent Guardrails — Defence in Depth</text><rect x="60" y="78" width="200" height="44" class="box2"/><text x="160" y="105" text-anchor="middle" class="mono">Input filter</text><text x="280" y="105" class="small">PII redact, prompt injection check</text><rect x="60" y="148" width="200" height="44" class="box3"/><text x="160" y="175" text-anchor="middle" class="mono">Tool whitelist</text><text x="280" y="175" class="small">only approved tools; arg validation</text><rect x="60" y="218" width="200" height="44" class="box4"/><text x="160" y="245" text-anchor="middle" class="mono">Sandbox exec</text><text x="280" y="245" class="small">containers / WASM / restricted FS</text><rect x="60" y="288" width="200" height="44" class="box5"/><text x="160" y="315" text-anchor="middle" class="mono">Output filter</text><text x="280" y="315" class="small">PII out; toxicity; policy classifier</text><rect x="60" y="358" width="200" height="44" class="box"/><text x="160" y="385" text-anchor="middle" class="mono">Human-in-the-loop</text><text x="280" y="385" class="small">approve high-risk actions</text><text x="40" y="450" class="mono">Defence in depth — assume one layer will fail.</text><text x="40" y="472" class="small">Prompt injection > 95% bypass any single defence; combine input filters + capability constraints + human gates.</text></svg>