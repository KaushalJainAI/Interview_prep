<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" width="720" height="380">
<style>
  .title { font: bold 16px sans-serif; fill: #1a1a1a; }
  .label { font: 12px sans-serif; fill: #333; }
  .small { font: 10px sans-serif; fill: #555; }
  .mono  { font: 13px 'Consolas','Courier New',monospace; fill: #111; }
  .box   { fill: #f6f8fa; stroke: #444; stroke-width: 1.2; }
  .box2  { fill: #e6f0ff; stroke: #1f6feb; stroke-width: 1.5; }
  .box3  { fill: #fff3cd; stroke: #b58900; stroke-width: 1.5; }
  .box4  { fill: #d4edda; stroke: #1a7f37; stroke-width: 1.5; }
  .box5  { fill: #fce7f3; stroke: #be185d; stroke-width: 1.5; }
  .arrow { stroke: #444; stroke-width: 1.6; fill: none; marker-end: url(#arr); }
  .arrow2{ stroke: #1f6feb; stroke-width: 2; fill: none; marker-end: url(#arrB); }
  .arrow3{ stroke: #d33; stroke-width: 2; fill: none; marker-end: url(#arrR); }
</style>
<defs>
  <marker id="arr"  viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#444"/></marker>
  <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#1f6feb"/></marker>
  <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#d33"/></marker>
</defs>
<text x="360" y="22" text-anchor="middle" class="title">Agent Evaluation Stack</text><rect x="40" y="60" width="160" height="40" class="box4"/><text x="120" y="86" text-anchor="middle" class="mono">Unit (component)</text><rect x="40" y="105" width="160" height="28" class="box"/><text x="50" y="125" class="small">• tool args correctness</text><rect x="40" y="137" width="160" height="28" class="box"/><text x="50" y="157" class="small">• retrieval recall@k</text><rect x="40" y="169" width="160" height="28" class="box"/><text x="50" y="189" class="small">• prompt → JSON validates</text><rect x="220" y="60" width="160" height="40" class="box2"/><text x="300" y="86" text-anchor="middle" class="mono">Integration (flow)</text><rect x="220" y="105" width="160" height="28" class="box"/><text x="230" y="125" class="small">• full trace ends</text><rect x="220" y="137" width="160" height="28" class="box"/><text x="230" y="157" class="small">• right tool sequence</text><rect x="220" y="169" width="160" height="28" class="box"/><text x="230" y="189" class="small">• budget respected</text><rect x="400" y="60" width="160" height="40" class="box3"/><text x="480" y="86" text-anchor="middle" class="mono">E2E (task)</text><rect x="400" y="105" width="160" height="28" class="box"/><text x="410" y="125" class="small">• task succeeds</text><rect x="400" y="137" width="160" height="28" class="box"/><text x="410" y="157" class="small">• user satisfied</text><rect x="400" y="169" width="160" height="28" class="box"/><text x="410" y="189" class="small">• ground truth match</text><text x="40" y="280" class="mono">LLM-as-judge: cheap proxy but biased; pair with human spot-checks.</text><text x="40" y="302" class="mono">Datasets: BrowseComp, SWE-bench, GAIA, TAU-bench, WebArena.</text><text x="40" y="324" class="mono">Track: success rate, cost / call, latency p95, # tool calls.</text><text x="40" y="350" class="small">Regression suite per release — store full traces for diff review.</text></svg>