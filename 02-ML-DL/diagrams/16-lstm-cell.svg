<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400">
<style>
  .title { font: bold 16px sans-serif; fill: #1a1a1a; }
  .label { font: 12px sans-serif; fill: #333; }
  .small { font: 10px sans-serif; fill: #555; }
  .mono  { font: 13px 'Consolas','Courier New',monospace; fill: #111; }
  .box   { fill: #f6f8fa; stroke: #444; stroke-width: 1.2; }
  .box2  { fill: #e6f0ff; stroke: #1f6feb; stroke-width: 1.5; }
  .box3  { fill: #fff3cd; stroke: #b58900; stroke-width: 1.5; }
  .box4  { fill: #d4edda; stroke: #1a7f37; stroke-width: 1.5; }
  .box5  { fill: #fce7f3; stroke: #be185d; stroke-width: 1.5; }
  .arrow { stroke: #444; stroke-width: 1.6; fill: none; marker-end: url(#arr); }
  .arrow2{ stroke: #1f6feb; stroke-width: 2; fill: none; marker-end: url(#arrB); }
  .arrow3{ stroke: #d33; stroke-width: 2; fill: none; marker-end: url(#arrR); }
</style>
<defs>
  <marker id="arr"  viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#444"/></marker>
  <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#1f6feb"/></marker>
  <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#d33"/></marker>
</defs>
<text x="360" y="22" text-anchor="middle" class="title">LSTM Cell — Gates &amp; Cell State</text><rect x="80" y="80" width="540" height="220" class="box" fill="#fafbff"/><rect x="120" y="112" width="80" height="36" class="box3"/><text x="160" y="135" text-anchor="middle" class="mono">forget f</text><rect x="200" y="112" width="80" height="36" class="box3"/><text x="240" y="135" text-anchor="middle" class="mono">input  i</text><rect x="280" y="112" width="80" height="36" class="box3"/><text x="320" y="135" text-anchor="middle" class="mono">candidate g</text><rect x="360" y="112" width="80" height="36" class="box3"/><text x="400" y="135" text-anchor="middle" class="mono">output o</text><rect x="80" y="210" width="540" height="36" fill="#d4edda" stroke="#1a7f37"/><text x="350" y="232" text-anchor="middle" class="mono">cell state cₜ  = fₜ ⊙ cₜ₋₁ + iₜ ⊙ gₜ</text><text x="350" y="280" text-anchor="middle" class="mono">hₜ = oₜ ⊙ tanh(cₜ)</text><text x="40" y="135" class="mono">[xₜ, hₜ₋₁]</text><path class="arrow" d="M 110 135 L 120 135"/><text x="40" y="350" class="small">Gates use sigmoid; candidate uses tanh. Cell state is the long-term highway.</text><text x="40" y="370" class="small">Solves vanishing-gradient by additive update through cₜ instead of multiplicative.</text></svg>