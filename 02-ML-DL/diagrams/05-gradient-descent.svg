<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 410" width="680" height="410">
<style>
  .title { font: bold 16px sans-serif; fill: #1a1a1a; }
  .label { font: 12px sans-serif; fill: #333; }
  .small { font: 10px sans-serif; fill: #555; }
  .mono  { font: 13px 'Consolas','Courier New',monospace; fill: #111; }
  .box   { fill: #f6f8fa; stroke: #444; stroke-width: 1.2; }
  .box2  { fill: #e6f0ff; stroke: #1f6feb; stroke-width: 1.5; }
  .box3  { fill: #fff3cd; stroke: #b58900; stroke-width: 1.5; }
  .box4  { fill: #d4edda; stroke: #1a7f37; stroke-width: 1.5; }
  .box5  { fill: #fce7f3; stroke: #be185d; stroke-width: 1.5; }
  .arrow { stroke: #444; stroke-width: 1.6; fill: none; marker-end: url(#arr); }
  .arrow2{ stroke: #1f6feb; stroke-width: 2; fill: none; marker-end: url(#arrB); }
  .arrow3{ stroke: #d33; stroke-width: 2; fill: none; marker-end: url(#arrR); }
</style>
<defs>
  <marker id="arr"  viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#444"/></marker>
  <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#1f6feb"/></marker>
  <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#d33"/></marker>
</defs>
<text x="340" y="22" text-anchor="middle" class="title">Gradient Descent on a Loss Surface</text><ellipse cx="320" cy="200" rx="180" ry="108.0" fill="none" stroke="#88a" stroke-width="1"/><ellipse cx="320" cy="200" rx="145" ry="87.0" fill="none" stroke="#88a" stroke-width="1"/><ellipse cx="320" cy="200" rx="110" ry="66.0" fill="none" stroke="#88a" stroke-width="1"/><ellipse cx="320" cy="200" rx="75" ry="45.0" fill="none" stroke="#88a" stroke-width="1"/><ellipse cx="320" cy="200" rx="40" ry="24.0" fill="none" stroke="#88a" stroke-width="1"/><circle cx="320" cy="200" r="6" fill="#1a7f37"/><text x="330" y="204" class="small">minimum</text><line x1="120" y1="80" x2="170" y2="120" stroke="#1f6feb" stroke-width="2"/><circle cx="120" cy="80" r="4" fill="#1f6feb"/><line x1="170" y1="120" x2="220" y2="150" stroke="#1f6feb" stroke-width="2"/><circle cx="170" cy="120" r="4" fill="#1f6feb"/><line x1="220" y1="150" x2="265" y2="175" stroke="#1f6feb" stroke-width="2"/><circle cx="220" cy="150" r="4" fill="#1f6feb"/><line x1="265" y1="175" x2="295" y2="190" stroke="#1f6feb" stroke-width="2"/><circle cx="265" cy="175" r="4" fill="#1f6feb"/><line x1="295" y1="190" x2="312" y2="198" stroke="#1f6feb" stroke-width="2"/><circle cx="295" cy="190" r="4" fill="#1f6feb"/><circle cx="312" cy="198" r="4" fill="#1f6feb"/><text x="100" y="70" class="mono">θ₀</text><line x1="540" y1="90" x2="490" y2="140" stroke="#d33" stroke-width="2"/><circle cx="540" cy="90" r="3" fill="#d33"/><line x1="490" y1="140" x2="510" y2="160" stroke="#d33" stroke-width="2"/><circle cx="490" cy="140" r="3" fill="#d33"/><line x1="510" y1="160" x2="460" y2="180" stroke="#d33" stroke-width="2"/><circle cx="510" cy="160" r="3" fill="#d33"/><line x1="460" y1="180" x2="440" y2="210" stroke="#d33" stroke-width="2"/><circle cx="460" cy="180" r="3" fill="#d33"/><line x1="440" y1="210" x2="390" y2="200" stroke="#d33" stroke-width="2"/><circle cx="440" cy="210" r="3" fill="#d33"/><line x1="390" y1="200" x2="360" y2="205" stroke="#d33" stroke-width="2"/><circle cx="390" cy="200" r="3" fill="#d33"/><line x1="360" y1="205" x2="340" y2="205" stroke="#d33" stroke-width="2"/><circle cx="360" cy="205" r="3" fill="#d33"/><text x="555" y="80" class="mono">θ₀ (SGD)</text><text x="40" y="340" class="mono">θ ← θ − η · ∇L(θ)</text><text x="40" y="362" class="small">Blue: batch GD — smooth path. Red: SGD — noisy but cheaper per step.</text><text x="40" y="382" class="small">Learning rate η: too small → slow; too large → overshoot / divergence.</text></svg>