<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" width="720" height="380">
<style>
  .title { font: bold 16px sans-serif; fill: #1a1a1a; }
  .label { font: 12px sans-serif; fill: #333; }
  .small { font: 10px sans-serif; fill: #555; }
  .mono  { font: 13px 'Consolas','Courier New',monospace; fill: #111; }
  .box   { fill: #f6f8fa; stroke: #444; stroke-width: 1.2; }
  .box2  { fill: #e6f0ff; stroke: #1f6feb; stroke-width: 1.5; }
  .box3  { fill: #fff3cd; stroke: #b58900; stroke-width: 1.5; }
  .box4  { fill: #d4edda; stroke: #1a7f37; stroke-width: 1.5; }
  .box5  { fill: #fce7f3; stroke: #be185d; stroke-width: 1.5; }
  .arrow { stroke: #444; stroke-width: 1.6; fill: none; marker-end: url(#arr); }
  .arrow2{ stroke: #1f6feb; stroke-width: 2; fill: none; marker-end: url(#arrB); }
  .arrow3{ stroke: #d33; stroke-width: 2; fill: none; marker-end: url(#arrR); }
</style>
<defs>
  <marker id="arr"  viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#444"/></marker>
  <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#1f6feb"/></marker>
  <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#d33"/></marker>
</defs>
<text x="360" y="22" text-anchor="middle" class="title">Classification Metrics — Confusion Matrix</text><rect x="190" y="100" width="140" height="60" class="box4"/><text x="260.0" y="135.0" text-anchor="middle" class="mono">TP</text><rect x="350" y="100" width="140" height="60" class="box3"/><text x="420.0" y="135.0" text-anchor="middle" class="mono">FN</text><rect x="190" y="170" width="140" height="60" class="box3"/><text x="260.0" y="205.0" text-anchor="middle" class="mono">FP</text><rect x="350" y="170" width="140" height="60" class="box4"/><text x="420.0" y="205.0" text-anchor="middle" class="mono">TN</text><text x="260" y="92" text-anchor="middle" class="small">Pred = 1</text><text x="420" y="92" text-anchor="middle" class="small">Pred = 0</text><text x="185" y="135" text-anchor="end" class="small">Actual=1</text><text x="185" y="205" text-anchor="end" class="small">Actual=0</text><text x="40" y="270" class="mono">Precision = TP / (TP + FP)         "of those I called positive, how many are?"</text><text x="40" y="290" class="mono">Recall    = TP / (TP + FN)         "of actual positives, how many did I catch?"</text><text x="40" y="310" class="mono">F1        = 2·P·R / (P + R)        harmonic mean — balances both</text><text x="40" y="330" class="mono">Accuracy  = (TP + TN) / total      misleading on imbalanced data</text><text x="40" y="350" class="mono">ROC-AUC   = P(score(pos) &gt; score(neg))  threshold-independent</text></svg>