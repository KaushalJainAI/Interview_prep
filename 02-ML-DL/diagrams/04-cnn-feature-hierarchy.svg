<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 480" font-family="Arial, sans-serif" font-size="13">
  <style>
    .box { fill:#fff; stroke:#222; stroke-width:2; }
    .lbl { fill:#222; text-anchor:middle; }
    .small { font-size:11px; fill:#444; text-anchor:middle; }
    .title { font-size:18px; font-weight:bold; text-anchor:middle; }
    .arrow { stroke:#222; stroke-width:1.8; fill:none; marker-end:url(#a); }
    .img { fill:#fff5e6; stroke:#d35400; }
    .conv { fill:#cfe2ff; }
    .pool { fill:#fff3cd; }
    .fc { fill:#d4edda; }
    .out { fill:#e2d9f3; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10z" fill="#222"/></marker>
  </defs>

  <text x="475" y="30" class="title">CNN — Feature Hierarchy from Pixels to Concepts</text>
  <text x="475" y="50" class="small">Each layer's "receptive field" grows: edges → textures → parts → objects</text>

  <!-- Input image -->
  <rect class="box img" x="40"  y="120" width="120" height="120" rx="4"/>
  <text x="100" y="185" class="lbl">image</text>
  <text x="100" y="260" class="small">224×224×3</text>

  <line class="arrow" x1="160" y1="180" x2="200" y2="180"/>

  <!-- Conv1 -->
  <rect class="box conv" x="200" y="135" width="100" height="90" rx="4"/>
  <text x="250" y="175" class="lbl">Conv 3×3</text>
  <text x="250" y="195" class="lbl small">+ ReLU</text>
  <text x="250" y="247" class="small">112×112×64</text>
  <text x="250" y="263" class="small">edges, gradients</text>

  <line class="arrow" x1="300" y1="180" x2="330" y2="180"/>

  <!-- Pool1 -->
  <rect class="box pool" x="330" y="150" width="70" height="60" rx="4"/>
  <text x="365" y="185" class="lbl small">MaxPool</text>
  <text x="365" y="232" class="small">56×56×64</text>

  <line class="arrow" x1="400" y1="180" x2="430" y2="180"/>

  <!-- Conv2 -->
  <rect class="box conv" x="430" y="145" width="80" height="70" rx="4"/>
  <text x="470" y="180" class="lbl small">Conv 3×3</text>
  <text x="470" y="237" class="small">28×28×128</text>
  <text x="470" y="252" class="small">textures, corners</text>

  <line class="arrow" x1="510" y1="180" x2="540" y2="180"/>

  <!-- Conv3 -->
  <rect class="box conv" x="540" y="155" width="70" height="50" rx="4"/>
  <text x="575" y="185" class="lbl small">Conv 3×3</text>
  <text x="575" y="225" class="small">14×14×256</text>
  <text x="575" y="240" class="small">parts (eyes, wheels)</text>

  <line class="arrow" x1="610" y1="180" x2="640" y2="180"/>

  <!-- Conv4 -->
  <rect class="box conv" x="640" y="160" width="50" height="40" rx="4"/>
  <text x="665" y="185" class="lbl small">Conv</text>
  <text x="665" y="215" class="small">7×7×512</text>
  <text x="665" y="230" class="small">objects</text>

  <line class="arrow" x1="690" y1="180" x2="720" y2="180"/>

  <!-- Global avg pool / FC -->
  <rect class="box fc" x="720" y="160" width="80" height="40" rx="4"/>
  <text x="760" y="185" class="lbl small">GAP / FC</text>
  <text x="760" y="220" class="small">1×1×512</text>

  <line class="arrow" x1="800" y1="180" x2="830" y2="180"/>

  <!-- Output -->
  <rect class="box out" x="830" y="160" width="90" height="40" rx="4"/>
  <text x="875" y="185" class="lbl small">Softmax</text>
  <text x="875" y="220" class="small">1000 classes</text>

  <!-- Concepts panel -->
  <rect class="box" x="40" y="320" width="880" height="140" rx="8" fill="#f8f9fa"/>
  <text x="475" y="343" class="lbl" font-weight="bold">CNN concepts to mention in interviews</text>
  <text x="55" y="365" font-size="12" fill="#333">• <tspan font-weight="bold">Convolution</tspan> = sliding learnable filter across input → translation-equivariant feature maps (same edge detected anywhere in image)</text>
  <text x="55" y="383" font-size="12" fill="#333">• <tspan font-weight="bold">Parameter sharing</tspan> = one filter has ~kernel² × in_ch × out_ch params, applied at every spatial position → orders of magnitude fewer params than FC</text>
  <text x="55" y="401" font-size="12" fill="#333">• <tspan font-weight="bold">Receptive field</tspan> grows with depth + pooling → deep neurons see large image regions, can detect objects</text>
  <text x="55" y="419" font-size="12" fill="#333">• <tspan font-weight="bold">Pooling</tspan> = downsample (max/avg) for translation invariance + reduce compute. Modern nets often use strided conv instead.</text>
  <text x="55" y="437" font-size="12" fill="#333">• <tspan font-weight="bold">Famous nets</tspan>: LeNet (1998) → AlexNet (2012, won ImageNet) → VGG (deep, simple) → ResNet (skip connections) → EfficientNet → Vision Transformer (ViT, 2020)</text>
  <text x="55" y="455" font-size="12" fill="#333">• Your <tspan font-style="italic">Voice Disorder Classification</tspan> uses this exact pattern on spectrograms — 2D image of frequency × time, treat as image, run CNN, ensemble with metadata</text>
</svg>
