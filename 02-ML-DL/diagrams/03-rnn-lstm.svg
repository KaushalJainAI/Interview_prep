<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 580" font-family="Arial, sans-serif" font-size="13">
  <style>
    .box { fill:#fff; stroke:#222; stroke-width:2; }
    .lbl { fill:#222; text-anchor:middle; }
    .small { font-size:11px; fill:#444; text-anchor:middle; }
    .title { font-size:18px; font-weight:bold; text-anchor:middle; }
    .arrow { stroke:#222; stroke-width:1.8; fill:none; marker-end:url(#a); }
    .cell { fill:#cfe2ff; }
    .gate-f { fill:#f8d7da; }
    .gate-i { fill:#d4edda; }
    .gate-o { fill:#e2d9f3; }
    .gate-g { fill:#fff3cd; }
    .state { fill:#fff5e6; stroke:#d35400; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10z" fill="#222"/></marker>
  </defs>

  <text x="475" y="30" class="title">RNN  vs  LSTM — Sequence Modeling Pre-Transformer</text>

  <!-- RNN unrolled -->
  <text x="100" y="75" class="lbl" font-weight="bold">Vanilla RNN (unrolled)</text>
  <text x="475" y="75" class="lbl" font-weight="bold">LSTM Cell — the gates that solved vanishing gradients</text>

  <!-- RNN cells -->
  <g transform="translate(40,90)">
    <rect class="box cell" x="0" y="60" width="80" height="60" rx="6"/>
    <text x="40" y="95" class="lbl">RNN</text>
    <rect class="box cell" x="100" y="60" width="80" height="60" rx="6"/>
    <text x="140" y="95" class="lbl">RNN</text>
    <rect class="box cell" x="200" y="60" width="80" height="60" rx="6"/>
    <text x="240" y="95" class="lbl">RNN</text>

    <line class="arrow" x1="80" y1="90" x2="100" y2="90"/>
    <line class="arrow" x1="180" y1="90" x2="200" y2="90"/>

    <!-- inputs -->
    <line class="arrow" x1="40" y1="140" x2="40" y2="120"/>
    <text x="40" y="160" class="lbl small">x_{t-1}</text>
    <line class="arrow" x1="140" y1="140" x2="140" y2="120"/>
    <text x="140" y="160" class="lbl small">x_t</text>
    <line class="arrow" x1="240" y1="140" x2="240" y2="120"/>
    <text x="240" y="160" class="lbl small">x_{t+1}</text>

    <!-- outputs -->
    <line class="arrow" x1="40" y1="60" x2="40" y2="40"/>
    <text x="40" y="30" class="lbl small">h_{t-1}</text>
    <line class="arrow" x1="140" y1="60" x2="140" y2="40"/>
    <text x="140" y="30" class="lbl small">h_t</text>
    <line class="arrow" x1="240" y1="60" x2="240" y2="40"/>
    <text x="240" y="30" class="lbl small">h_{t+1}</text>

    <!-- formula -->
    <text x="140" y="200" class="lbl small">h_t = tanh(W_xh · x_t  +  W_hh · h_{t-1}  +  b)</text>
    <text x="140" y="220" class="small" fill="#d32f2f">Problem: repeated multiplication of W_hh → exploding/vanishing gradients</text>
  </g>

  <!-- LSTM cell detail -->
  <g transform="translate(380,100)">
    <!-- prev cell state arrow in -->
    <text x="10" y="65" class="lbl small">c_{t-1}</text>
    <line class="arrow" x1="40" y1="60" x2="540" y2="60"/>
    <text x="560" y="65" class="lbl small">c_t</text>

    <!-- prev hidden in -->
    <text x="10" y="135" class="lbl small">h_{t-1}</text>
    <line class="arrow" x1="40" y1="130" x2="100" y2="130"/>
    <line class="arrow" x1="540" y1="130" x2="570" y2="130"/>
    <text x="590" y="135" class="lbl small">h_t</text>

    <!-- input -->
    <text x="100" y="225" class="lbl small">x_t</text>
    <line class="arrow" x1="100" y1="210" x2="100" y2="135"/>

    <!-- gates row -->
    <rect class="box gate-f" x="130" y="100" width="60" height="60" rx="4"/>
    <text x="160" y="125" class="lbl small">forget</text>
    <text x="160" y="143" class="lbl small">σ</text>

    <rect class="box gate-i" x="210" y="100" width="60" height="60" rx="4"/>
    <text x="240" y="125" class="lbl small">input</text>
    <text x="240" y="143" class="lbl small">σ</text>

    <rect class="box gate-g" x="290" y="100" width="60" height="60" rx="4"/>
    <text x="320" y="125" class="lbl small">candidate</text>
    <text x="320" y="143" class="lbl small">tanh</text>

    <rect class="box gate-o" x="370" y="100" width="60" height="60" rx="4"/>
    <text x="400" y="125" class="lbl small">output</text>
    <text x="400" y="143" class="lbl small">σ</text>

    <!-- cell state operations -->
    <circle cx="160" cy="60" r="10" fill="#fff" stroke="#222" stroke-width="1.5"/>
    <text x="160" y="64" class="lbl small">×</text>
    <line class="arrow" x1="160" y1="100" x2="160" y2="70"/>

    <circle cx="280" cy="60" r="10" fill="#fff" stroke="#222" stroke-width="1.5"/>
    <text x="280" y="64" class="lbl small">+</text>
    <line class="arrow" x1="240" y1="100" x2="270" y2="65"/>
    <line class="arrow" x1="320" y1="100" x2="290" y2="65"/>

    <!-- output gate combining -->
    <line x1="280" y1="60" x2="490" y2="60" stroke="#222" stroke-width="1.5" fill="none"/>
    <line x1="490" y1="60" x2="490" y2="180" stroke="#222" stroke-width="1.5" fill="none"/>
    <rect class="box" x="465" y="180" width="50" height="25" rx="3" fill="#fff3cd"/>
    <text x="490" y="197" class="lbl small">tanh</text>
    <circle cx="490" cy="225" r="10" fill="#fff" stroke="#222" stroke-width="1.5"/>
    <text x="490" y="229" class="lbl small">×</text>
    <line class="arrow" x1="430" y1="130" x2="478" y2="220"/>
    <line class="arrow" x1="490" y1="205" x2="490" y2="215"/>
    <line class="arrow" x1="490" y1="235" x2="490" y2="260"/>
    <line class="arrow" x1="490" y1="260" x2="540" y2="260"/>
    <line class="arrow" x1="540" y1="260" x2="540" y2="130"/>
  </g>

  <!-- explanation panel -->
  <rect class="box" x="50" y="380" width="850" height="180" rx="8" fill="#f8f9fa"/>
  <text x="475" y="403" class="lbl" font-weight="bold">LSTM intuition — three gates control the cell state highway</text>
  <text x="60" y="425" font-size="12" fill="#333">• <tspan font-weight="bold">Forget gate (f):</tspan>  c_t = f ⊙ c_{t-1}  — what to drop from memory  (σ ∈ [0,1])</text>
  <text x="60" y="443" font-size="12" fill="#333">• <tspan font-weight="bold">Input gate (i) + candidate (g):</tspan>  c_t += i ⊙ g  — what to write to memory</text>
  <text x="60" y="461" font-size="12" fill="#333">• <tspan font-weight="bold">Output gate (o):</tspan>  h_t = o ⊙ tanh(c_t)  — what to expose as hidden state</text>
  <text x="60" y="484" font-size="12" fill="#333">• The cell state c_t flows ALMOST unchanged through time (top horizontal arrow) — gradient highway, no repeated W multiplications</text>
  <text x="60" y="502" font-size="12" fill="#333">• This is why LSTM handles long sequences when vanilla RNN can't — same trick (additive path) as ResNet residuals &amp; transformer residuals</text>
  <text x="60" y="525" font-size="12" fill="#333">• <tspan font-weight="bold">GRU</tspan> = simplified LSTM (2 gates instead of 3, no separate cell state); fewer params, similar quality on most tasks</text>
  <text x="60" y="543" font-size="12" fill="#333">• Mostly replaced by Transformers for NLP, but still used in: small-device speech, your <tspan font-style="italic">fMRI Autism Detection</tspan> project, time-series forecasting</text>
</svg>
