  .box3  { fill: #fff3cd; stroke: #b58900; stroke-width: 1.5; }
  .box4  { fill: #d4edda; stroke: #1a7f37; stroke-width: 1.5; }
  .box5  { fill: #fce7f3; stroke: #be185d; stroke-width: 1.5; }
  .arrow { stroke: #444; stroke-width: 1.6; fill: none; marker-end: url(#arr); }
  .arrow2{ stroke: #1f6feb; stroke-width: 2; fill: none; marker-end: url(#arrB); }
  .arrow3{ stroke: #d33; stroke-width: 2; fill: none; marker-end: url(#arrR); }
</style>
<defs>
  <marker id="arr"  viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#444"/></marker>
  <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#1f6feb"/></marker>
  <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#d33"/></marker>
</defs>
<text x="340" y="22" text-anchor="middle" class="title">Optimizers — SGD vs Momentum vs Adam</text><ellipse cx="320" cy="220" rx="180" ry="99.00000000000001" fill="none" stroke="#aab" stroke-width="1"/><ellipse cx="320" cy="220" rx="140" ry="77.0" fill="none" stroke="#aab" stroke-width="1"/><ellipse cx="320" cy="220" rx="100" ry="55.00000000000001" fill="none" stroke="#aab" stroke-width="1"/><ellipse cx="320" cy="220" rx="60" ry="33.0" fill="none" stroke="#aab" stroke-width="1"/><circle cx="320" cy="220" r="5" fill="#1a7f37"/><line x1="80" y1="290" x2="140" y2="170" stroke="#d33" stroke-width="2"/><circle cx="80" cy="290" r="3" fill="#d33"/><line x1="140" y1="170" x2="170" y2="280" stroke="#d33" stroke-width="2"/><circle cx="140" cy="170" r="3" fill="#d33"/><line x1="170" y1="280" x2="220" y2="180" stroke="#d33" stroke-width="2"/><circle cx="170" cy="280" r="3" fill="#d33"/><line x1="220" y1="180" x2="255" y2="270" stroke="#d33" stroke-width="2"/><circle cx="220" cy="180" r="3" fill="#d33"/><line x1="255" y1="270" x2="285" y2="195" stroke="#d33" stroke-width="2"/><circle cx="255" cy="270" r="3" fill="#d33"/><line x1="285" y1="195" x2="305" y2="250" stroke="#d33" stroke-width="2"/><circle cx="285" cy="195" r="3" fill="#d33"/><line x1="305" y1="250" x2="315" y2="225" stroke="#d33" stroke-width="2"/><circle cx="305" cy="250" r="3" fill="#d33"/><text x="60" y="305" class="mono" fill="#d33">SGD</text><line x1="80" y1="90" x2="150" y2="120" stroke="#b58900" stroke-width="2"/><circle cx="80" cy="90" r="3" fill="#b58900"/><line x1="150" y1="120" x2="220" y2="160" stroke="#b58900" stroke-width="2"/><circle cx="150" cy="120" r="3" fill="#b58900"/><line x1="220" y1="160" x2="270" y2="185" stroke="#b58900" stroke-width="2"/><circle cx="220" cy="160" r="3" fill="#b58900"/><line x1="270" y1="185" x2="300" y2="205" stroke="#b58900" stroke-width="2"/><circle cx="270" cy="185" r="3" fill="#b58900"/><line x1="300" y1="205" x2="315" y2="218" stroke="#b58900" stroke-width="2"/><circle cx="300" cy="205" r="3" fill="#b58900"/><text x="60" y="80" class="mono" fill="#b58900">Momentum</text><line x1="540" y1="90" x2="470" y2="135" stroke="#1f6feb" stroke-width="2"/><circle cx="540" cy="90" r="3" fill="#1f6feb"/><line x1="470" y1="135" x2="410" y2="165" stroke="#1f6feb" stroke-width="2"/><circle cx="470" cy="135" r="3" fill="#1f6feb"/><line x1="410" y1="165" x2="370" y2="190" stroke="#1f6feb" stroke-width="2"/><circle cx="410" cy="165" r="3" fill="#1f6feb"/><line x1="370" y1="190" x2="340" y2="210" stroke="#1f6feb" stroke-width="2"/><circle cx="370" cy="190" r="3" fill="#1f6feb"/><line x1="340" y1="210" x2="322" y2="220" stroke="#1f6feb" stroke-width="2"/><circle cx="340" cy="210" r="3" fill="#1f6feb"/><text x="555" y="80" class="mono" fill="#1f6feb">Adam</text><text x="40" y="360" class="mono">Momentum:  v ← βv + (1-β)∇L;  θ ← θ - η·v</text><text x="40" y="380" class="mono">Adam:      m,v ← EMA(∇,∇²);    θ ← θ - η · m̂/(√v̂+ε)</text><text x="40" y="402" class="small">Adam = momentum + adaptive per-parameter LR. Defaults: β₁=0.9, β₂=0.999, ε=1e-8.</text></svg>