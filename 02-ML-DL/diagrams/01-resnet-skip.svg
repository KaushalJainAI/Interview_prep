<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" font-family="Arial, sans-serif" font-size="13">
  <style>
    .box { fill:#fff; stroke:#222; stroke-width:2; }
    .lbl { fill:#222; text-anchor:middle; }
    .small { font-size:11px; fill:#444; text-anchor:middle; }
    .title { font-size:18px; font-weight:bold; text-anchor:middle; }
    .arrow { stroke:#222; stroke-width:1.8; fill:none; marker-end:url(#a); }
    .skip { stroke:#1565c0; stroke-width:2.5; fill:none; marker-end:url(#b); }
    .conv { fill:#cfe2ff; }
    .bn { fill:#fff3cd; }
    .act { fill:#d4edda; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10z" fill="#222"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10z" fill="#1565c0"/></marker>
  </defs>

  <text x="400" y="30" class="title">ResNet Skip Connection — The Idea Behind 1000-Layer Networks</text>

  <!-- Input -->
  <rect class="box" x="320" y="70" width="160" height="40" rx="6"/>
  <text x="400" y="95" class="lbl">Input  x</text>

  <line class="arrow" x1="400" y1="110" x2="400" y2="140"/>
  <circle cx="400" cy="150" r="6" fill="#222"/>

  <!-- skip path right -->
  <line x1="400" y1="150" x2="650" y2="150" stroke="#1565c0" stroke-width="2.5"/>
  <line x1="650" y1="150" x2="650" y2="370" stroke="#1565c0" stroke-width="2.5"/>
  <text x="680" y="260" class="small" fill="#1565c0">identity skip</text>

  <!-- main path -->
  <line class="arrow" x1="400" y1="156" x2="400" y2="180"/>

  <rect class="box conv" x="320" y="180" width="160" height="40" rx="6"/>
  <text x="400" y="205" class="lbl">3×3 Conv</text>

  <line class="arrow" x1="400" y1="220" x2="400" y2="240"/>
  <rect class="box bn" x="320" y="240" width="160" height="30" rx="6"/>
  <text x="400" y="260" class="lbl">BatchNorm</text>

  <line class="arrow" x1="400" y1="270" x2="400" y2="290"/>
  <rect class="box act" x="320" y="290" width="160" height="30" rx="6"/>
  <text x="400" y="310" class="lbl">ReLU</text>

  <line class="arrow" x1="400" y1="320" x2="400" y2="340"/>
  <rect class="box conv" x="320" y="340" width="160" height="40" rx="6"/>
  <text x="400" y="365" class="lbl">3×3 Conv</text>

  <line class="arrow" x1="400" y1="380" x2="400" y2="400"/>

  <!-- add -->
  <circle cx="400" cy="412" r="14" fill="#fff" stroke="#222" stroke-width="2"/>
  <text x="400" y="417" class="lbl">+</text>
  <line x1="650" y1="370" x2="650" y2="412" stroke="#1565c0" stroke-width="2.5"/>
  <line x1="650" y1="412" x2="414" y2="412" stroke="#1565c0" stroke-width="2.5" marker-end="url(#b)"/>

  <line class="arrow" x1="400" y1="426" x2="400" y2="445"/>
  <text x="400" y="465" class="lbl">y = F(x) + x</text>

  <!-- explanation panel left -->
  <rect class="box" x="40" y="120" width="240" height="280" rx="8" fill="#f8f9fa"/>
  <text x="160" y="143" class="lbl" font-weight="bold">Why skip connections work</text>
  <text x="55" y="168" font-size="12" fill="#333">• Gradient highway:  ∂L/∂x = ∂L/∂y · (∂F/∂x + 1)</text>
  <text x="55" y="186" font-size="12" fill="#333">• The "+1" means gradient never vanishes</text>
  <text x="55" y="204" font-size="12" fill="#333">  through identity, even at 1000 layers</text>
  <text x="55" y="227" font-size="12" fill="#333">• Block learns the RESIDUAL F(x) = y − x,</text>
  <text x="55" y="245" font-size="12" fill="#333">  which is closer to zero than y</text>
  <text x="55" y="268" font-size="12" fill="#333">• Lets very deep networks train</text>
  <text x="55" y="286" font-size="12" fill="#333">  without degrading accuracy</text>
  <text x="55" y="310" font-size="12" fill="#333">• Same idea now in Transformers</text>
  <text x="55" y="328" font-size="12" fill="#333">  (residual after MHA &amp; FFN)</text>
  <text x="55" y="356" font-size="12" fill="#333">• 1×1 conv on skip path if input</text>
  <text x="55" y="374" font-size="12" fill="#333">  channels ≠ output channels</text>
</svg>
