<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 440" width="680" height="440">
<style>
  .title { font: bold 16px sans-serif; fill: #1a1a1a; }
  .label { font: 12px sans-serif; fill: #333; }
  .small { font: 10px sans-serif; fill: #555; }
  .mono  { font: 13px 'Consolas','Courier New',monospace; fill: #111; }
  .box   { fill: #f6f8fa; stroke: #444; stroke-width: 1.2; }
  .box2  { fill: #e6f0ff; stroke: #1f6feb; stroke-width: 1.5; }
  .box3  { fill: #fff3cd; stroke: #b58900; stroke-width: 1.5; }
  .box4  { fill: #d4edda; stroke: #1a7f37; stroke-width: 1.5; }
  .box5  { fill: #fce7f3; stroke: #be185d; stroke-width: 1.5; }
  .arrow { stroke: #444; stroke-width: 1.6; fill: none; marker-end: url(#arr); }
  .arrow2{ stroke: #1f6feb; stroke-width: 2; fill: none; marker-end: url(#arrB); }
  .arrow3{ stroke: #d33; stroke-width: 2; fill: none; marker-end: url(#arrR); }
</style>
<defs>
  <marker id="arr"  viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#444"/></marker>
  <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#1f6feb"/></marker>
  <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#d33"/></marker>
</defs>
<text x="340" y="22" text-anchor="middle" class="title">Scaled Dot-Product Attention</text><text x="40" y="55" class="label">Self-attention:  softmax(QKᵀ / √d) · V</text><rect x="60" y="80" width="80" height="40" class="box"/><text x="100" y="105" text-anchor="middle" class="mono">The</text><rect x="160" y="80" width="80" height="40" class="box"/><text x="200" y="105" text-anchor="middle" class="mono">cat</text><rect x="260" y="80" width="80" height="40" class="box"/><text x="300" y="105" text-anchor="middle" class="mono">sat</text><rect x="360" y="80" width="80" height="40" class="box"/><text x="400" y="105" text-anchor="middle" class="mono">on</text><rect x="460" y="80" width="80" height="40" class="box"/><text x="500" y="105" text-anchor="middle" class="mono">mat</text><rect x="60" y="160" width="80" height="36" class="box2"/><text x="100" y="182" text-anchor="middle" class="mono">Q_1</text><line x1="100" y1="120" x2="100" y2="160" stroke="#aaa" stroke-dasharray="2 2"/><rect x="160" y="160" width="80" height="36" class="box2"/><text x="200" y="182" text-anchor="middle" class="mono">Q_2</text><line x1="200" y1="120" x2="200" y2="160" stroke="#aaa" stroke-dasharray="2 2"/><rect x="260" y="160" width="80" height="36" class="box2"/><text x="300" y="182" text-anchor="middle" class="mono">Q_3</text><line x1="300" y1="120" x2="300" y2="160" stroke="#aaa" stroke-dasharray="2 2"/><rect x="360" y="160" width="80" height="36" class="box2"/><text x="400" y="182" text-anchor="middle" class="mono">Q_4</text><line x1="400" y1="120" x2="400" y2="160" stroke="#aaa" stroke-dasharray="2 2"/><rect x="460" y="160" width="80" height="36" class="box2"/><text x="500" y="182" text-anchor="middle" class="mono">Q_5</text><line x1="500" y1="120" x2="500" y2="160" stroke="#aaa" stroke-dasharray="2 2"/><rect x="60" y="220" width="80" height="36" class="box3"/><text x="100" y="242" text-anchor="middle" class="mono">K_1</text><rect x="160" y="220" width="80" height="36" class="box3"/><text x="200" y="242" text-anchor="middle" class="mono">K_2</text><rect x="260" y="220" width="80" height="36" class="box3"/><text x="300" y="242" text-anchor="middle" class="mono">K_3</text><rect x="360" y="220" width="80" height="36" class="box3"/><text x="400" y="242" text-anchor="middle" class="mono">K_4</text><rect x="460" y="220" width="80" height="36" class="box3"/><text x="500" y="242" text-anchor="middle" class="mono">K_5</text><rect x="60" y="280" width="80" height="36" class="box4"/><text x="100" y="302" text-anchor="middle" class="mono">V_1</text><rect x="160" y="280" width="80" height="36" class="box4"/><text x="200" y="302" text-anchor="middle" class="mono">V_2</text><rect x="260" y="280" width="80" height="36" class="box4"/><text x="300" y="302" text-anchor="middle" class="mono">V_3</text><rect x="360" y="280" width="80" height="36" class="box4"/><text x="400" y="302" text-anchor="middle" class="mono">V_4</text><rect x="460" y="280" width="80" height="36" class="box4"/><text x="500" y="302" text-anchor="middle" class="mono">V_5</text><text x="20" y="180" class="mono">Q:</text><text x="20" y="240" class="mono">K:</text><text x="20" y="300" class="mono">V:</text><text x="40" y="380" class="mono">attn_ij = softmax_j ( Q_i · K_j / √d )</text><text x="40" y="400" class="small">"Each token mixes information from all others, weighted by Q·K similarity."</text><text x="40" y="418" class="small">Multi-head: H independent (Q,K,V) projections, concat outputs → linear.</text></svg>