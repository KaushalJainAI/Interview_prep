<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" width="720" height="480">
<style>
  .title { font: bold 16px sans-serif; fill: #1a1a1a; }
  .label { font: 12px sans-serif; fill: #333; }
  .small { font: 10px sans-serif; fill: #555; }
  .mono  { font: 13px 'Consolas','Courier New',monospace; fill: #111; }
  .box   { fill: #f6f8fa; stroke: #444; stroke-width: 1.2; }
  .box2  { fill: #e6f0ff; stroke: #1f6feb; stroke-width: 1.5; }
  .box3  { fill: #fff3cd; stroke: #b58900; stroke-width: 1.5; }
  .box4  { fill: #d4edda; stroke: #1a7f37; stroke-width: 1.5; }
  .box5  { fill: #fce7f3; stroke: #be185d; stroke-width: 1.5; }
  .arrow { stroke: #444; stroke-width: 1.6; fill: none; marker-end: url(#arr); }
  .arrow2{ stroke: #1f6feb; stroke-width: 2; fill: none; marker-end: url(#arrB); }
  .arrow3{ stroke: #d33; stroke-width: 2; fill: none; marker-end: url(#arrR); }
</style>
<defs>
  <marker id="arr"  viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#444"/></marker>
  <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#1f6feb"/></marker>
  <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#d33"/></marker>
</defs>
<text x="360" y="22" text-anchor="middle" class="title">LLM-as-Judge -- Biases &amp; Mitigations</text><rect x="60" y="60" width="220" height="40" class="box5"/><text x="170" y="85" text-anchor="middle" class="mono">Position bias</text><text x="300" y="85" class="small">judge favours response shown first</text><rect x="60" y="110" width="220" height="40" class="box5"/><text x="170" y="135" text-anchor="middle" class="mono">Length bias</text><text x="300" y="135" class="small">longer answers rated higher</text><rect x="60" y="160" width="220" height="40" class="box5"/><text x="170" y="185" text-anchor="middle" class="mono">Self-preference</text><text x="300" y="185" class="small">model rates its own outputs higher</text><rect x="60" y="210" width="220" height="40" class="box5"/><text x="170" y="235" text-anchor="middle" class="mono">Sycophancy</text><text x="300" y="235" class="small">agrees with prompt's framing</text><rect x="60" y="260" width="220" height="40" class="box5"/><text x="170" y="285" text-anchor="middle" class="mono">Confidence inflation</text><text x="300" y="285" class="small">overconfident on subjective items</text><rect x="60" y="310" width="220" height="40" class="box5"/><text x="170" y="335" text-anchor="middle" class="mono">Knowledge cutoff</text><text x="300" y="335" class="small">judge unaware of newer facts</text><text x="40" y="380" class="label">Mitigations:</text><text x="60" y="402" class="small">- randomise A/B order, average</text><text x="60" y="420" class="small">- normalise / cap length</text><text x="60" y="438" class="small">- judge with a DIFFERENT model than the system under test</text><text x="60" y="456" class="small">- pair with sampled human review; never trust judge alone</text></svg>