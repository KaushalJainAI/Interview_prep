<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400">
<style>
  .title { font: bold 16px sans-serif; fill: #1a1a1a; }
  .label { font: 12px sans-serif; fill: #333; }
  .small { font: 10px sans-serif; fill: #555; }
  .mono  { font: 13px 'Consolas','Courier New',monospace; fill: #111; }
  .box   { fill: #f6f8fa; stroke: #444; stroke-width: 1.2; }
  .box2  { fill: #e6f0ff; stroke: #1f6feb; stroke-width: 1.5; }
  .box3  { fill: #fff3cd; stroke: #b58900; stroke-width: 1.5; }
  .box4  { fill: #d4edda; stroke: #1a7f37; stroke-width: 1.5; }
  .box5  { fill: #fce7f3; stroke: #be185d; stroke-width: 1.5; }
  .arrow { stroke: #444; stroke-width: 1.6; fill: none; marker-end: url(#arr); }
  .arrow2{ stroke: #1f6feb; stroke-width: 2; fill: none; marker-end: url(#arrB); }
  .arrow3{ stroke: #d33; stroke-width: 2; fill: none; marker-end: url(#arrR); }
</style>
<defs>
  <marker id="arr"  viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#444"/></marker>
  <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#1f6feb"/></marker>
  <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#d33"/></marker>
</defs>
<text x="360" y="22" text-anchor="middle" class="title">Quantization — FP16 → INT8 → INT4</text><text x="40" y="60" class="label">FP16 (16 bits, ~65k values)</text><line x1="40" y1="90" x2="680" y2="90" stroke="#1f6feb" stroke-width="2"/><line x1="40" y1="86" x2="40" y2="94" stroke="#1f6feb"/><line x1="60" y1="86" x2="60" y2="94" stroke="#1f6feb"/><line x1="80" y1="86" x2="80" y2="94" stroke="#1f6feb"/><line x1="100" y1="86" x2="100" y2="94" stroke="#1f6feb"/><line x1="120" y1="86" x2="120" y2="94" stroke="#1f6feb"/><line x1="140" y1="86" x2="140" y2="94" stroke="#1f6feb"/><line x1="160" y1="86" x2="160" y2="94" stroke="#1f6feb"/><line x1="180" y1="86" x2="180" y2="94" stroke="#1f6feb"/><line x1="200" y1="86" x2="200" y2="94" stroke="#1f6feb"/><line x1="220" y1="86" x2="220" y2="94" stroke="#1f6feb"/><line x1="240" y1="86" x2="240" y2="94" stroke="#1f6feb"/><line x1="260" y1="86" x2="260" y2="94" stroke="#1f6feb"/><line x1="280" y1="86" x2="280" y2="94" stroke="#1f6feb"/><line x1="300" y1="86" x2="300" y2="94" stroke="#1f6feb"/><line x1="320" y1="86" x2="320" y2="94" stroke="#1f6feb"/><line x1="340" y1="86" x2="340" y2="94" stroke="#1f6feb"/><line x1="360" y1="86" x2="360" y2="94" stroke="#1f6feb"/><line x1="380" y1="86" x2="380" y2="94" stroke="#1f6feb"/><line x1="400" y1="86" x2="400" y2="94" stroke="#1f6feb"/><line x1="420" y1="86" x2="420" y2="94" stroke="#1f6feb"/><line x1="440" y1="86" x2="440" y2="94" stroke="#1f6feb"/><line x1="460" y1="86" x2="460" y2="94" stroke="#1f6feb"/><line x1="480" y1="86" x2="480" y2="94" stroke="#1f6feb"/><line x1="500" y1="86" x2="500" y2="94" stroke="#1f6feb"/><line x1="520" y1="86" x2="520" y2="94" stroke="#1f6feb"/><line x1="540" y1="86" x2="540" y2="94" stroke="#1f6feb"/><line x1="560" y1="86" x2="560" y2="94" stroke="#1f6feb"/><line x1="580" y1="86" x2="580" y2="94" stroke="#1f6feb"/><line x1="600" y1="86" x2="600" y2="94" stroke="#1f6feb"/><line x1="620" y1="86" x2="620" y2="94" stroke="#1f6feb"/><line x1="640" y1="86" x2="640" y2="94" stroke="#1f6feb"/><line x1="660" y1="86" x2="660" y2="94" stroke="#1f6feb"/><line x1="680" y1="86" x2="680" y2="94" stroke="#1f6feb"/><text x="40" y="140" class="label">INT8 (256 values)</text><line x1="40" y1="170" x2="680" y2="170" stroke="#1a7f37" stroke-width="2"/><line x1="40" y1="164" x2="40" y2="176" stroke="#1a7f37"/><line x1="80" y1="164" x2="80" y2="176" stroke="#1a7f37"/><line x1="120" y1="164" x2="120" y2="176" stroke="#1a7f37"/><line x1="160" y1="164" x2="160" y2="176" stroke="#1a7f37"/><line x1="200" y1="164" x2="200" y2="176" stroke="#1a7f37"/><line x1="240" y1="164" x2="240" y2="176" stroke="#1a7f37"/><line x1="280" y1="164" x2="280" y2="176" stroke="#1a7f37"/><line x1="320" y1="164" x2="320" y2="176" stroke="#1a7f37"/><line x1="360" y1="164" x2="360" y2="176" stroke="#1a7f37"/><line x1="400" y1="164" x2="400" y2="176" stroke="#1a7f37"/><line x1="440" y1="164" x2="440" y2="176" stroke="#1a7f37"/><line x1="480" y1="164" x2="480" y2="176" stroke="#1a7f37"/><line x1="520" y1="164" x2="520" y2="176" stroke="#1a7f37"/><line x1="560" y1="164" x2="560" y2="176" stroke="#1a7f37"/><line x1="600" y1="164" x2="600" y2="176" stroke="#1a7f37"/><line x1="640" y1="164" x2="640" y2="176" stroke="#1a7f37"/><line x1="680" y1="164" x2="680" y2="176" stroke="#1a7f37"/><text x="40" y="220" class="label">INT4 (16 values)</text><line x1="40" y1="250" x2="680" y2="250" stroke="#d33" stroke-width="2"/><line x1="40" y1="244" x2="40" y2="256" stroke="#d33"/><line x1="120" y1="244" x2="120" y2="256" stroke="#d33"/><line x1="200" y1="244" x2="200" y2="256" stroke="#d33"/><line x1="280" y1="244" x2="280" y2="256" stroke="#d33"/><line x1="360" y1="244" x2="360" y2="256" stroke="#d33"/><line x1="440" y1="244" x2="440" y2="256" stroke="#d33"/><line x1="520" y1="244" x2="520" y2="256" stroke="#d33"/><line x1="600" y1="244" x2="600" y2="256" stroke="#d33"/><line x1="680" y1="244" x2="680" y2="256" stroke="#d33"/><text x="40" y="310" class="mono">Memory:  FP16 = 2N bytes;  INT8 = N bytes;  INT4 = N/2 bytes</text><text x="40" y="332" class="mono">Quantize:  q = round((x − zero_point) / scale)  with calibration on activations</text><text x="40" y="354" class="small">GPTQ, AWQ, GGUF for INT4. Latency↓, memory↓; small quality drop.</text><text x="40" y="374" class="small">LLaMA-7B: FP16 = 14 GB, INT4 = ~3.5 GB → runs on consumer GPU.</text></svg>