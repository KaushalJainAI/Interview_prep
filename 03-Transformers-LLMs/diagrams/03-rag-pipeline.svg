<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" font-family="Arial, sans-serif" font-size="13">
  <style>
    .box { fill:#fff; stroke:#222; stroke-width:2; }
    .lbl { fill:#222; text-anchor:middle; }
    .small { font-size:11px; fill:#444; text-anchor:middle; }
    .arrow { stroke:#222; stroke-width:1.8; fill:none; marker-end:url(#a); }
    .title { font-size:18px; font-weight:bold; text-anchor:middle; }
    .ingest { fill:#fff3cd; }
    .store { fill:#cfe2ff; }
    .query { fill:#d1e7dd; }
    .llm { fill:#e2d9f3; }
    .rerank { fill:#f8d7da; }
    .label { font-size:12px; fill:#1565c0; text-anchor:middle; font-style:italic; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10z" fill="#222"/></marker>
  </defs>

  <text x="500" y="28" class="title">RAG — Retrieval-Augmented Generation Pipeline</text>

  <!-- INGEST (top row) -->
  <text x="500" y="65" class="label">── INGEST (offline) ──</text>
  <rect class="box ingest" x="40" y="80" width="110" height="50" rx="6"/>
  <text x="95" y="105" class="lbl">Raw docs</text>
  <text x="95" y="120" class="small">PDFs, HTML, MD</text>

  <line class="arrow" x1="150" y1="105" x2="200" y2="105"/>
  <rect class="box ingest" x="200" y="80" width="110" height="50" rx="6"/>
  <text x="255" y="105" class="lbl">Chunker</text>
  <text x="255" y="120" class="small">512 tok + 50 overlap</text>

  <line class="arrow" x1="310" y1="105" x2="360" y2="105"/>
  <rect class="box ingest" x="360" y="80" width="110" height="50" rx="6"/>
  <text x="415" y="105" class="lbl">Embedder</text>
  <text x="415" y="120" class="small">bge-large / OpenAI-3</text>

  <line class="arrow" x1="470" y1="105" x2="520" y2="105"/>
  <rect class="box store" x="520" y="80" width="150" height="50" rx="6"/>
  <text x="595" y="105" class="lbl">Vector DB (HNSW)</text>
  <text x="595" y="120" class="small">FAISS / pgvector / Qdrant</text>

  <line class="arrow" x1="595" y1="130" x2="595" y2="240"/>

  <!-- QUERY (bottom row) -->
  <text x="500" y="200" class="label">── QUERY (online) ──</text>

  <rect class="box query" x="40" y="230" width="110" height="50" rx="6"/>
  <text x="95" y="255" class="lbl">User query</text>

  <line class="arrow" x1="150" y1="255" x2="200" y2="255"/>
  <rect class="box query" x="200" y="230" width="110" height="50" rx="6"/>
  <text x="255" y="255" class="lbl">Same Embedder</text>
  <text x="255" y="270" class="small">(must match ingest!)</text>

  <line class="arrow" x1="310" y1="255" x2="520" y2="255"/>
  <rect class="box store" x="520" y="230" width="150" height="50" rx="6"/>
  <text x="595" y="255" class="lbl">ANN search top-k</text>
  <text x="595" y="270" class="small">k=20-50, + BM25 hybrid</text>

  <line class="arrow" x1="670" y1="255" x2="720" y2="255"/>
  <rect class="box rerank" x="720" y="230" width="130" height="50" rx="6"/>
  <text x="785" y="255" class="lbl">Cross-encoder</text>
  <text x="785" y="270" class="small">rerank → top-5</text>

  <line class="arrow" x1="785" y1="280" x2="785" y2="350"/>

  <rect class="box" x="540" y="350" width="490" height="60" rx="6" fill="#f8f9fa"/>
  <text x="785" y="375" class="lbl" font-weight="bold">Prompt template</text>
  <text x="785" y="395" class="small">"Answer using only these docs: [1] {chunk_1} … Question: {query}"</text>

  <line class="arrow" x1="540" y1="380" x2="490" y2="380"/>
  <rect class="box llm" x="340" y="350" width="150" height="60" rx="6"/>
  <text x="415" y="375" class="lbl">LLM</text>
  <text x="415" y="395" class="small">Claude / GPT / Llama</text>

  <line class="arrow" x1="340" y1="380" x2="290" y2="380"/>
  <rect class="box" x="120" y="350" width="170" height="60" rx="6" fill="#d4edda"/>
  <text x="205" y="375" class="lbl">Answer + citations</text>
  <text x="205" y="395" class="small">[1] [3]</text>

  <!-- Pitfalls box -->
  <rect class="box" x="40" y="440" width="920" height="95" rx="8" fill="#fff5f5"/>
  <text x="500" y="463" class="lbl" font-weight="bold">Top pitfalls to mention in interviews</text>
  <text x="60" y="483" font-size="12" fill="#333">• Chunk size matters more than embedding choice — start 512 tok + 50 overlap, tune on eval set</text>
  <text x="60" y="500" font-size="12" fill="#333">• Query and docs MUST use the same embedder (no zero-shot swap)</text>
  <text x="60" y="517" font-size="12" fill="#333">• Hybrid (dense + BM25) via RRF beats pure dense — sparse catches IDs, codes, acronyms</text>
  <text x="60" y="532" font-size="12" fill="#333">• "Lost in the middle" → put question near the END of context (Liu et al. 2023)</text>
</svg>
