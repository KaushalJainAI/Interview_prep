<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" width="720" height="430">
<style>
  .title { font: bold 16px sans-serif; fill: #1a1a1a; }
  .label { font: 12px sans-serif; fill: #333; }
  .small { font: 10px sans-serif; fill: #555; }
  .mono  { font: 13px 'Consolas','Courier New',monospace; fill: #111; }
  .box   { fill: #f6f8fa; stroke: #444; stroke-width: 1.2; }
  .box2  { fill: #e6f0ff; stroke: #1f6feb; stroke-width: 1.5; }
  .box3  { fill: #fff3cd; stroke: #b58900; stroke-width: 1.5; }
  .box4  { fill: #d4edda; stroke: #1a7f37; stroke-width: 1.5; }
  .box5  { fill: #fce7f3; stroke: #be185d; stroke-width: 1.5; }
  .arrow { stroke: #444; stroke-width: 1.6; fill: none; marker-end: url(#arr); }
  .arrow2{ stroke: #1f6feb; stroke-width: 2; fill: none; marker-end: url(#arrB); }
  .arrow3{ stroke: #d33; stroke-width: 2; fill: none; marker-end: url(#arrR); }
</style>
<defs>
  <marker id="arr"  viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#444"/></marker>
  <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#1f6feb"/></marker>
  <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#d33"/></marker>
</defs>
<text x="360" y="22" text-anchor="middle" class="title">LLM Scaling Laws</text><line x1="80" y1="320" x2="640" y2="320" stroke="#333"/><line x1="80" y1="60" x2="80" y2="320" stroke="#333"/><text x="635" y="340" class="small">compute / data / params (log)</text><text x="65" y="60" text-anchor="end" class="small">loss (log)</text><line x1="90" y1="100" x2="640" y2="236.125" stroke="#1f6feb" stroke-width="2.5"/><text x="650" y="240.125" class="mono" fill="#1f6feb">params N</text><line x1="90" y1="140" x2="640" y2="251.375" stroke="#1a7f37" stroke-width="2.5"/><text x="650" y="255.375" class="mono" fill="#1a7f37">data D</text><line x1="90" y1="180" x2="640" y2="303.75" stroke="#d33" stroke-width="2.5"/><text x="650" y="307.75" class="mono" fill="#d33">compute C</text><text x="40" y="360" class="mono">L(N,D,C) ≈ A·N^(-α) + B·D^(-β) + C·C^(-γ)   (irreducible floor + power-laws)</text><text x="40" y="382" class="mono">Chinchilla (Hoffmann 2022): optimal D ≈ 20·N tokens for given compute</text><text x="40" y="402" class="small">Implication: many earlier models were UNDER-trained (e.g. GPT-3 trained on far &lt;20× tokens).</text></svg>