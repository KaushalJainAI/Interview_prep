<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" width="720" height="460">
<style>
  .title { font: bold 16px sans-serif; fill: #1a1a1a; }
  .label { font: 12px sans-serif; fill: #333; }
  .small { font: 10px sans-serif; fill: #555; }
  .mono  { font: 13px 'Consolas','Courier New',monospace; fill: #111; }
  .box   { fill: #f6f8fa; stroke: #444; stroke-width: 1.2; }
  .box2  { fill: #e6f0ff; stroke: #1f6feb; stroke-width: 1.5; }
  .box3  { fill: #fff3cd; stroke: #b58900; stroke-width: 1.5; }
  .box4  { fill: #d4edda; stroke: #1a7f37; stroke-width: 1.5; }
  .box5  { fill: #fce7f3; stroke: #be185d; stroke-width: 1.5; }
  .arrow { stroke: #444; stroke-width: 1.6; fill: none; marker-end: url(#arr); }
  .arrow2{ stroke: #1f6feb; stroke-width: 2; fill: none; marker-end: url(#arrB); }
  .arrow3{ stroke: #d33; stroke-width: 2; fill: none; marker-end: url(#arrR); }
</style>
<defs>
  <marker id="arr"  viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#444"/></marker>
  <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#1f6feb"/></marker>
  <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#d33"/></marker>
</defs>
<text x="360" y="22" text-anchor="middle" class="title">Prompt Message-Role Hierarchy</text><rect x="60" y="64" width="180" height="50" class="box2"/><text x="150" y="92" text-anchor="middle" class="mono">system</text><text x="260" y="85" class="label">OS-level rules; rarely user-visible</text><rect x="60" y="134" width="180" height="50" class="box3"/><text x="150" y="162" text-anchor="middle" class="mono">developer</text><text x="260" y="155" class="label">tool-use rules, format contract, examples</text><rect x="60" y="204" width="180" height="50" class="box4"/><text x="150" y="232" text-anchor="middle" class="mono">user</text><text x="260" y="225" class="label">the task or question</text><rect x="60" y="274" width="180" height="50" class="box5"/><text x="150" y="302" text-anchor="middle" class="mono">assistant</text><text x="260" y="295" class="label">prior turns (conversation history)</text><text x="40" y="380" class="mono">Priority: system &gt; developer &gt; user.</text><text x="40" y="402" class="label">Hard rule:</text><text x="40" y="422" class="small">Never concatenate untrusted user input into the system / developer message.</text><text x="40" y="440" class="small">User-supplied or retrieved text belongs in user role, wrapped in delimiters.</text></svg>