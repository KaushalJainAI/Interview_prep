<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400">
<style>
  .title { font: bold 16px sans-serif; fill: #1a1a1a; }
  .label { font: 12px sans-serif; fill: #333; }
  .small { font: 10px sans-serif; fill: #555; }
  .mono  { font: 13px 'Consolas','Courier New',monospace; fill: #111; }
  .box   { fill: #f6f8fa; stroke: #444; stroke-width: 1.2; }
  .box2  { fill: #e6f0ff; stroke: #1f6feb; stroke-width: 1.5; }
  .box3  { fill: #fff3cd; stroke: #b58900; stroke-width: 1.5; }
  .box4  { fill: #d4edda; stroke: #1a7f37; stroke-width: 1.5; }
  .box5  { fill: #fce7f3; stroke: #be185d; stroke-width: 1.5; }
  .arrow { stroke: #444; stroke-width: 1.6; fill: none; marker-end: url(#arr); }
  .arrow2{ stroke: #1f6feb; stroke-width: 2; fill: none; marker-end: url(#arrB); }
  .arrow3{ stroke: #d33; stroke-width: 2; fill: none; marker-end: url(#arrR); }
</style>
<defs>
  <marker id="arr"  viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#444"/></marker>
  <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#1f6feb"/></marker>
  <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#d33"/></marker>
</defs>
<text x="360" y="22" text-anchor="middle" class="title">LoRA — Low-Rank Adaptation</text><rect x="80" y="80" width="180" height="180" class="box" opacity="0.7"/><text x="170" y="180" text-anchor="middle" class="mono">W (frozen)</text><text x="170" y="200" text-anchor="middle" class="small">d × d</text><text x="280" y="180" text-anchor="middle" class="mono">+</text><rect x="320" y="80" width="60" height="180" class="box4"/><text x="350" y="180" text-anchor="middle" class="mono">A</text><text x="350" y="200" text-anchor="middle" class="small">d × r</text><rect x="400" y="160" width="180" height="40" class="box4"/><text x="490" y="185" text-anchor="middle" class="mono">B</text><text x="490" y="220" text-anchor="middle" class="small">r × d</text><text x="610" y="180" text-anchor="middle" class="mono">≈ W'</text><text x="40" y="300" class="mono">Effective update:  W' = W + ΔW = W + AB    where rank(AB) ≤ r ≪ d</text><text x="40" y="325" class="mono">Trainable params drop from d² to 2·d·r  →  ~1% of full fine-tune</text><text x="40" y="350" class="small">Typical r=8-64. QLoRA = LoRA on 4-bit quantised base model — 65B in 48GB.</text><text x="40" y="370" class="small">Multiple adapters can be hot-swapped at inference (one base + N small adapters).</text></svg>