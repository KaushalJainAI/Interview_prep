<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" width="720" height="430">
<style>
  .title { font: bold 16px sans-serif; fill: #1a1a1a; }
  .label { font: 12px sans-serif; fill: #333; }
  .small { font: 10px sans-serif; fill: #555; }
  .mono  { font: 13px 'Consolas','Courier New',monospace; fill: #111; }
  .box   { fill: #f6f8fa; stroke: #444; stroke-width: 1.2; }
  .box2  { fill: #e6f0ff; stroke: #1f6feb; stroke-width: 1.5; }
  .box3  { fill: #fff3cd; stroke: #b58900; stroke-width: 1.5; }
  .box4  { fill: #d4edda; stroke: #1a7f37; stroke-width: 1.5; }
  .box5  { fill: #fce7f3; stroke: #be185d; stroke-width: 1.5; }
  .arrow { stroke: #444; stroke-width: 1.6; fill: none; marker-end: url(#arr); }
  .arrow2{ stroke: #1f6feb; stroke-width: 2; fill: none; marker-end: url(#arrB); }
  .arrow3{ stroke: #d33; stroke-width: 2; fill: none; marker-end: url(#arrR); }
</style>
<defs>
  <marker id="arr"  viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#444"/></marker>
  <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#1f6feb"/></marker>
  <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#d33"/></marker>
</defs>
<text x="360" y="22" text-anchor="middle" class="title">Byte-Pair Encoding — Merge Trace</text><text x="20" y="90" class="small">init</text><rect x="220" y="70" width="40" height="36" class="box2"/><text x="240.0" y="92" text-anchor="middle" class="mono">l</text><rect x="266" y="70" width="40" height="36" class="box2"/><text x="286.0" y="92" text-anchor="middle" class="mono">o</text><rect x="312" y="70" width="40" height="36" class="box2"/><text x="332.0" y="92" text-anchor="middle" class="mono">w</text><rect x="358" y="70" width="40" height="36" class="box2"/><text x="378.0" y="92" text-anchor="middle" class="mono">e</text><rect x="404" y="70" width="40" height="36" class="box2"/><text x="424.0" y="92" text-anchor="middle" class="mono">s</text><rect x="450" y="70" width="40" height="36" class="box2"/><text x="470.0" y="92" text-anchor="middle" class="mono">t</text><text x="20" y="142" class="small">merge e+s → es</text><rect x="220" y="122" width="40" height="36" class="box2"/><text x="240.0" y="144" text-anchor="middle" class="mono">l</text><rect x="266" y="122" width="40" height="36" class="box2"/><text x="286.0" y="144" text-anchor="middle" class="mono">o</text><rect x="312" y="122" width="40" height="36" class="box2"/><text x="332.0" y="144" text-anchor="middle" class="mono">w</text><rect x="358" y="122" width="40" height="36" class="box2"/><text x="378.0" y="144" text-anchor="middle" class="mono">es</text><rect x="404" y="122" width="40" height="36" class="box2"/><text x="424.0" y="144" text-anchor="middle" class="mono">t</text><text x="20" y="194" class="small">merge es+t → est</text><rect x="220" y="174" width="40" height="36" class="box2"/><text x="240.0" y="196" text-anchor="middle" class="mono">l</text><rect x="266" y="174" width="40" height="36" class="box2"/><text x="286.0" y="196" text-anchor="middle" class="mono">o</text><rect x="312" y="174" width="40" height="36" class="box2"/><text x="332.0" y="196" text-anchor="middle" class="mono">w</text><rect x="358" y="174" width="43" height="36" class="box2"/><text x="379.5" y="196" text-anchor="middle" class="mono">est</text><text x="20" y="246" class="small">merge l+o → lo</text><rect x="220" y="226" width="40" height="36" class="box2"/><text x="240.0" y="248" text-anchor="middle" class="mono">lo</text><rect x="266" y="226" width="40" height="36" class="box2"/><text x="286.0" y="248" text-anchor="middle" class="mono">w</text><rect x="312" y="226" width="43" height="36" class="box2"/><text x="333.5" y="248" text-anchor="middle" class="mono">est</text><text x="20" y="298" class="small">merge lo+w → low</text><rect x="220" y="278" width="43" height="36" class="box2"/><text x="241.5" y="300" text-anchor="middle" class="mono">low</text><rect x="269" y="278" width="43" height="36" class="box2"/><text x="290.5" y="300" text-anchor="middle" class="mono">est</text><text x="20" y="370" class="label">BPE iteratively merges the most-frequent adjacent pair into a new token.</text><text x="20" y="388" class="small">Stops at target vocab size (e.g. 32k for LLaMA, 50k for GPT-2, 100k for GPT-4).</text><text x="20" y="406" class="small">Rare words become several subwords; common words become one token.</text></svg>